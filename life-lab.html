<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生命世界與科學方法實驗室</title>
<style>
  :root {
    --bg: #f5f1e7;
    --ink: #5d4037;
    --ink-soft: #8d7366;
    --card: rgba(255,255,255,.58);
    --accent: #a1674a;
    --ok: #4f7d5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: absolute; inset: 0; }
  #scene canvas { display: block; touch-action: none; }
  .glass {
    background: var(--card); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,.9); box-shadow: 0 18px 44px rgba(93,64,55,.1), 0 2px 6px rgba(93,64,55,.05);
  }
  .panel { position: absolute; top: 18px; left: 18px; width: 318px; max-height: calc(100vh - 36px); overflow-y: auto; z-index: 10; border-radius: 26px; padding: 18px; }
  .panel.collapsed { width: auto; min-width: 240px; }
  .panel.collapsed .body { display: none; }
  .collapse { position: absolute; top: 18px; right: 16px; z-index: 2; cursor: pointer; border: none; font: inherit; font-size: .76rem; font-weight: 600; color: var(--accent); background: rgba(161,103,74,.12); border-radius: 999px; padding: 4px 12px; }
  .back { font-size: .78rem; color: var(--accent); text-decoration: none; }
  .title { font-size: 1.12rem; font-weight: 800; margin-top: 6px; padding-right: 62px; line-height: 1.4; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0 10px; }
  .tab { border: none; cursor: pointer; font: inherit; font-size: .78rem; font-weight: 800; padding: 9px 4px; border-radius: 14px; color: var(--ink); background: rgba(255,255,255,.6); line-height: 1.4; }
  .tab small { display: block; font-weight: 600; opacity: .8; font-size: .68rem; }
  .tab:hover { background: rgba(255,255,255,.95); }
  .tab.on { color: #fff; background: #8d6e63; box-shadow: 0 6px 16px rgba(93,64,55,.25); }
  .sec[hidden] { display: none; }
  .concept { background: rgba(255,255,255,.85); border-radius: 16px; padding: 10px 12px; margin: 2px 0 8px; box-shadow: 0 4px 14px rgba(93,64,55,.07); border-left: 5px solid var(--cc, #8d6e63); }
  .concept .ct { font-size: 1rem; font-weight: 900; color: var(--cc, #8d6e63); }
  .concept .cd { font-size: .82rem; font-weight: 700; margin-top: 2px; line-height: 1.6; }
  .desc { font-size: .78rem; color: var(--ink-soft); line-height: 1.65; margin: 6px 0; }
  .desc b { color: var(--ink); }
  .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: .8rem; font-weight: 800; color: var(--ink-soft); margin-top: 10px; }
  .lab b { font-size: 1.1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  input.big[type=range] { height: 40px; }
  .ticks { display: flex; justify-content: space-between; font-size: .68rem; font-weight: 800; color: var(--ink-soft); margin-top: -4px; }
  select { width: 100%; font: inherit; font-size: .86rem; font-weight: 700; border: 1px solid #e6dccd; border-radius: 12px; padding: 9px 10px; background: rgba(255,255,255,.9); color: var(--ink); margin-top: 4px; }
  .btn {
    width: 100%; border: none; border-radius: 14px; padding: 10px 6px; cursor: pointer; margin-top: 6px;
    font: inherit; font-size: .82rem; font-weight: 700; color: var(--ink); background: rgba(255,255,255,.62);
    transition: background .2s, transform .1s, box-shadow .2s;
  }
  .btn small { display: block; font-weight: 600; font-size: .7rem; opacity: .8; }
  .btn:hover { background: rgba(255,255,255,.95); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.on { color: #fff; background: #a1674a; box-shadow: 0 6px 16px rgba(161,103,74,.28); }
  .btn.primary { color: #fff; background: #5b8a72; box-shadow: 0 6px 16px rgba(79,125,92,.28); font-size: .9rem; padding: 12px 6px; }
  .btn.primary:hover { background: #4f7d65; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { background: rgba(255,255,255,.78); border-radius: 14px; padding: 9px 11px; margin-top: 8px; font-size: .8rem; line-height: 1.75; font-variant-numeric: tabular-nums; }
  .stat b { font-size: .92rem; }
  .stat .r { color: #c62828; } .stat .b { color: #1e6aa8; } .stat .g { color: var(--ok); } .stat .o { color: #d35400; }
  .mapbox { background: rgba(255,255,255,.85); border-radius: 14px; padding: 8px; margin-top: 8px; }
  .mapbox canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  .mapbox p { font-size: .72rem; font-weight: 800; color: var(--ink-soft); margin-bottom: 4px; }

  .dock { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 9; border-radius: 24px; padding: 12px 22px; text-align: center;
          width: max-content; max-width: min(900px, calc(100vw - 380px)); min-width: 300px; }
  .cap { font-size: .9rem; font-weight: 700; line-height: 1.6; }
  .cap small { display: block; font-size: .72rem; color: var(--ink-soft); font-weight: 700; letter-spacing: .06em; }
  .cap b { color: #a1674a; }
  .cap .huge { display: block; font-size: clamp(1.1rem, 2.2vw, 1.8rem); font-weight: 900; line-height: 1.4; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .cap .pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .cap .red { color: #c62828; } .cap .blu { color: #1e6aa8; } .cap .grn { color: var(--ok); } .cap .org { color: #d35400; }
  .cap .chg { font-size: .62em; font-weight: 800; vertical-align: middle; }

  .tag {
    position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%);
    font-size: .74rem; font-weight: 800; padding: 4px 10px; border-radius: 12px; white-space: nowrap; text-align: center; line-height: 1.45;
    background: rgba(255,255,255,.88); color: var(--ink); box-shadow: 0 4px 12px rgba(93,64,55,.1); font-variant-numeric: tabular-nums;
  }
  .tag.red { background: #e53935; color: #fff; }
  .tag.energy { background: #f4a261; color: #fff; font-size: .82rem; }
  .tag.yel { background: #fff3c4; color: #8a6200; border: 1.5px solid #e0b000; }
  .tag.lam { background: #1e6aa8; color: #fff; }
  .tag.depth { background: #d84315; color: #fff; font-size: .82rem; }
  .tag.small { font-size: .64rem; padding: 2px 7px; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-soft); line-height: 1.8; }

  @media (max-width: 768px), (max-width: 1100px) and (orientation: portrait) {
    .dock { top: 8px; bottom: auto; left: 8px; right: 8px; transform: none; max-width: none; min-width: 0; width: auto; padding: 8px 10px; border-radius: 18px; }
    .cap { font-size: .74rem; }
    .cap .huge { font-size: .98rem; }
    .tag { font-size: .62rem; padding: 2px 7px; }
  }
  .tabs.three { grid-template-columns: 1fr 1fr 1fr; }
  .tabs.three .tab { font-size: .74rem; padding: 9px 2px; }
  .three-btn { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .three-btn .btn { padding: 8px 2px; font-size: .8rem; }
  .objs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .objs .btn { padding: 8px 2px; font-size: .8rem; margin-top: 0; }
  .objs .btn i { display: block; font-style: normal; font-size: 1.3rem; line-height: 1.2; }
  .objs .btn.done::after { content: " ✓"; color: var(--ok); font-weight: 900; }
  .btn.tbtn.done { box-shadow: inset 0 0 0 2px rgba(79,125,92,.5); }
  .btn.tbtn.run { color: #fff; background: #d08a2e; }
  .res { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: baseline; }
  .res b { white-space: nowrap; }
  .res .y { color: var(--ok); } .res .n { color: #c62828; } .res .q { color: #b9aa98; }
  .res span { font-size: .76rem; line-height: 1.5; }
  .judge { border-radius: 14px; padding: 0; margin-top: 6px; font-size: .84rem; font-weight: 700; line-height: 1.6; }
  .judge.ok { background: #e3f1e6; color: #2e6b3f; padding: 10px 12px; }
  .judge.bad { background: #fde5e2; color: #a5311f; padding: 10px 12px; }
  .judge.hint { background: #fff3d6; color: #8a5a00; padding: 10px 12px; }
  .flow { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 6px; }
  .flow span { font-size: .7rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.7); color: #b9aa98; }
  .flow span.done { background: #dcebdf; color: #3c6e4c; }
  .flow span.cur { background: #d08a2e; color: #fff; box-shadow: 0 3px 10px rgba(208,138,46,.35); }
  .hypnote { font-size: .76rem; font-weight: 700; line-height: 1.55; margin-top: 4px; }
  .hypnote.bad { color: #c62828; } .hypnote.ok { color: var(--ok); }
  table.cfg { width: 100%; border-collapse: separate; border-spacing: 4px; margin-top: 2px; font-size: .78rem; }
  table.cfg th { font-weight: 800; color: var(--ink-soft); text-align: left; white-space: nowrap; }
  table.cfg thead th { text-align: center; font-size: .76rem; padding: 3px; border-radius: 8px; color: #fff; }
  table.cfg th.ca { background: #d9822b; } table.cfg th.cb { background: #3f74c9; }
  table.cfg select { margin: 0; padding: 6px 4px; font-size: .78rem; }
  table.cfg select.diff { border-color: #d08a2e; box-shadow: 0 0 0 2px rgba(208,138,46,.35); }
  .concl { border-radius: 14px; margin-top: 8px; font-size: .82rem; font-weight: 700; line-height: 1.6; }
  .concl:not(:empty) { padding: 10px 12px; background: rgba(255,255,255,.85); }
  .concl.ok { background: #e3f1e6 !important; color: #2e6b3f; }
  .concl.bad { background: #fde5e2 !important; color: #a5311f; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: .82rem; font-weight: 800; margin: 10px 2px 0; cursor: pointer; }
  .chk input { width: 18px; height: 18px; accent-color: #a1674a; }
  .dpad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 40px); gap: 4px; justify-content: center; margin-top: 4px; }
  .dpad button { border: none; border-radius: 12px; font: inherit; font-size: 1rem; font-weight: 900; color: var(--ink); background: rgba(255,255,255,.8); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
  .dpad button:active, .dpad button.on { background: #a1674a; color: #fff; }
  .dpad .dc { display: grid; place-items: center; font-size: .7rem; font-weight: 800; color: var(--ink-soft); }
  .steps { display: grid; gap: 3px; background: rgba(255,255,255,.8); border-radius: 14px; padding: 8px 10px; margin-top: 8px; font-size: .76rem; font-weight: 700; line-height: 1.45; }
  .steps div { color: #a8998a; }
  .steps div.done { color: var(--ok); }
  .steps div.now { color: var(--ink); background: #fff3d6; border-radius: 8px; padding: 2px 6px; margin: 0 -6px; }
  .scope-view { position: absolute; z-index: 8; right: 22px; top: 50%; transform: translateY(-50%); width: min(34vw, 340px); text-align: center; pointer-events: none; }
  .scope-view[hidden] { display: none; }
  .scope-view .eye { position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: #111; box-shadow: 0 0 0 10px #2d2a28, 0 0 0 13px #6d6259, 0 18px 40px rgba(0,0,0,.35); }
  .scope-view canvas { width: 100%; height: 100%; display: block; }
  .scope-cap { margin-top: 22px; font-size: .8rem; font-weight: 800; line-height: 1.5; background: rgba(255,255,255,.88); border-radius: 14px; padding: 6px 10px; box-shadow: 0 4px 14px rgba(93,64,55,.12); }
  .scope-cap b { color: #a1674a; }
  .cap .warn { color: #c62828; animation: pop .45s cubic-bezier(.2,1.6,.4,1); display: inline-block; }
  .tag.ok { background: #4f7d5c; color: #fff; } .tag.no { background: #c62828; color: #fff; } .tag.unk { background: rgba(255,255,255,.88); color: #8d7366; }
  .tag.ga { background: #d9822b; color: #fff; } .tag.gb { background: #3f74c9; color: #fff; }
  .tag.part { font-size: .66rem; padding: 2px 7px; background: rgba(62,44,37,.82); color: #fff; }
  @media (max-width: 768px), (max-width: 1100px) and (orientation: portrait) {
    .scope-view { top: 64px; right: 8px; transform: none; width: 150px; }
    .scope-view .eye { box-shadow: 0 0 0 5px #2d2a28, 0 0 0 7px #6d6259, 0 8px 20px rgba(0,0,0,.3); }
    .scope-cap { margin-top: 10px; font-size: .62rem; padding: 4px 6px; }
  }
</style>
<script src="quality.js"></script>
<script src="mobile.js"></script>
<script src="keypoints.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

  }

<body data-mv-start="closed">

<div id="scene"></div>
<div class="dock glass" id="dock"><div class="cap" id="cap"></div></div>
<div class="scope-view" id="scopeView" hidden>
  <div class="eye"><canvas id="eyeCv" width="420" height="420"></canvas></div>
  <div class="scope-cap" id="scopeCap"></div>
</div>

<aside class="panel glass" id="panel">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g7">‹ 課程總覽</a>
  <div class="title">生命世界與科學方法實驗室</div>
  <div class="body">
    <div class="tabs three">
      <button class="tab on" data-tab="life">🌱 生命現象<small>生物或非生物</small></button>
      <button class="tab" data-tab="sci">🍞 科學方法<small>麵包發霉實驗</small></button>
      <button class="tab" data-tab="scope">🔬 顯微鏡<small>操作與成像</small></button>
    </div>

    <!-- Tab 1 -->
    <section class="sec" data-tab="life">
      <div class="concept" style="--cc:#4f7d5c"><div class="ct">會表現生命現象的就是生物</div><div class="cd">生命現象：<b>代謝、生長、感應、生殖</b><br>生物不一定要同時表現出全部的生命現象</div></div>
      <label class="lab">① 選一個樣本放上檢測台</label>
      <div class="objs" id="lfObjs"></div>
      <label class="lab">② 檢測生命現象</label>
      <div class="row2">
        <button class="btn tbtn" data-t="met">🍽️ 代謝<small>給水和養分</small></button>
        <button class="btn tbtn" data-t="grow">🌱 生長<small>時間快轉</small></button>
        <button class="btn tbtn" data-t="sense">👆 感應<small>給它刺激</small></button>
        <button class="btn tbtn" data-t="repro">🐣 生殖<small>等待下一代</small></button>
      </div>
      <button class="btn primary" id="lfAll">▶ 四項一起檢測</button>
      <div class="stat" id="lfStat"></div>
      <label class="lab">③ 你的判斷</label>
      <div class="row2">
        <button class="btn" id="jAlive">🌿 是生物</button>
        <button class="btn" id="jNot">🪨 是非生物</button>
      </div>
      <div class="judge" id="lfJudge"></div>
      <p class="desc">🌍 地球上的生物要生存，需要<b>陽光、空氣、水、養分</b>。</p>
    </section>

    <!-- Tab 2 -->
    <section class="sec" data-tab="sci" hidden>
      <div class="flow" id="flow"></div>
      <p class="desc">👀 <b>觀察</b>：忘在書包裡的麵包發霉了！<br>❓ <b>問題</b>：是什麼原因讓麵包發霉？<br>📚 <b>查資料</b>：黴菌來自空氣，喜歡潮濕、有養分的地方。</p>
      <label class="lab">④ 提出假說</label>
      <select id="hyp">
        <option value="">請選擇一個假說…</option>
        <option value="h1">溫暖潮濕的環境適合黴菌生長</option>
        <option value="h2">有光照的地方，麵包比較容易發霉</option>
        <option value="h3">環境中的黴菌會自行生長</option>
      </select>
      <div class="hypnote" id="hypNote"></div>
      <label class="lab">⑤ 設計實驗：兩組只能有<b>一個</b>條件不同</label>
      <table class="cfg">
        <thead><tr><th></th><th class="ca">A 實驗組</th><th class="cb">B 對照組</th></tr></thead>
        <tbody>
          <tr><th>水分</th><td><select id="aWater"><option value="wet">💧 噴水</option><option value="dry">不噴水</option></select></td><td><select id="bWater"><option value="wet">💧 噴水</option><option value="dry" selected>不噴水</option></select></td></tr>
          <tr><th>溫度</th><td><select id="aTemp"><option value="warm">🌡️ 室溫</option><option value="cold">❄️ 冰箱</option></select></td><td><select id="bTemp"><option value="warm">🌡️ 室溫</option><option value="cold">❄️ 冰箱</option></select></td></tr>
          <tr><th>光線</th><td><select id="aLight"><option value="light">☀️ 有光</option><option value="dark">🌑 陰暗</option></select></td><td><select id="bLight"><option value="light">☀️ 有光</option><option value="dark">🌑 陰暗</option></select></td></tr>
        </tbody>
      </table>
      <div class="stat" id="scFair"></div>
      <label class="lab" for="day">⑥ 實驗觀察天數<b><span id="dayV">0</span> 天</b></label>
      <input type="range" id="day" min="0" max="7" step="0.05" value="0">
      <div class="row2">
        <button class="btn primary" id="scPlay">▶ 觀察 7 天</button>
        <button class="btn" id="scReset">↺ 換新麵包</button>
      </div>
      <div class="mapbox"><p>📈 發霉面積（應變變因）</p><canvas id="moldChart" width="600" height="300"></canvas></div>
      <div class="concl" id="scConc"></div>
    </section>

    <!-- Tab 3 -->
    <section class="sec" data-tab="scope" hidden>
      <div class="row2">
        <button class="btn mbtn on" data-m="comp">🔬 複式顯微鏡</button>
        <button class="btn mbtn" data-m="ster">🔍 解剖顯微鏡</button>
      </div>
      <label class="lab">觀察的標本</label>
      <div class="three-btn">
        <button class="btn sbtn on" data-s="ap">「ap」字<small>玻片</small></button>
        <button class="btn sbtn" data-s="para">草履蟲<small>水滴玻片</small></button>
        <button class="btn sbtn" data-s="beetle">金龜子<small>不透光</small></button>
      </div>
      <div id="compCtl">
        <label class="lab">目鏡</label>
        <div class="row2"><button class="btn ebtn on" data-e="10">10×</button><button class="btn ebtn" data-e="15">15×</button></div>
        <label class="lab">物鏡（轉動旋轉盤）</label>
        <div class="three-btn"><button class="btn obtn on" data-o="4">4×<small>低倍</small></button><button class="btn obtn" data-o="10">10×</button><button class="btn obtn" data-o="40">40×<small>高倍</small></button></div>
      </div>
      <div id="sterCtl" hidden>
        <label class="lab">倍率調整輪（目鏡 10×）</label>
        <div class="row2"><button class="btn zbtn on" data-z="2">物鏡 2×</button><button class="btn zbtn" data-z="4">物鏡 4×</button></div>
      </div>
      <label class="lab" for="coarse"><span id="coarseLab">粗調節輪</span><b id="coarseV"></b></label>
      <input class="big" type="range" id="coarse" min="0" max="200" step="1" value="60">
      <div id="fineBox">
        <label class="lab" for="fine">細調節輪<b id="fineV"></b></label>
        <input class="big" type="range" id="fine" min="-100" max="100" step="1" value="0">
      </div>
      <label class="lab" for="aper"><span id="aperLab">光圈（進光量）</span><b id="aperV"></b></label>
      <input type="range" id="aper" min="5" max="100" step="1" value="55">
      <label class="lab">移動玻片（按住箭頭推玻片）</label>
      <div class="dpad">

  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== t; });
  for (const [k, v] of Object.entries(TABS)) v.group.visible = k === t;
  $('scopeView').hidden = t !== 'scope';
  renderer.domElement.style.cursor = '';
  goView(TABS[t].cam());
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* file:// */ }
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
function layoutDock() {
  const d = $('dock');
  if (window.MobileView?.isMobile()) { d.style.left = ''; d.style.maxWidth = ''; return; }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  d.style.left = ((left + window.innerWidth) / 2) + 'px';
  d.style.maxWidth = Math.max(300, window.innerWidth - left - 28) + 'px';
}
function viewFor(c) {
  const pos = V3(...c.pos), tgt = V3(...c.target);
  if (!window.innerWidth || !window.innerHeight) return { pos, tgt };
  if (window.MobileView?.isMobile()) {
    const dist = pos.distanceTo(tgt), tanH = Math.tan(Math.min(camera.fov, 50) * Math.PI / 360);
    const need = (c.fitW || 0) * 1.08 / (2 * tanH * camera.aspect);
    if (need > dist) pos.sub(tgt).multiplyScalar(need / dist).add(tgt);
    return { pos, tgt };
  }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  const dist = pos.distanceTo(tgt), tanH = Math.tan(camera.fov * Math.PI / 360);
  if (c.fitW) {
    const avail = Math.max(0.35, (window.innerWidth - left) / window.innerWidth);
    const need = c.fitW / avail / (2 * tanH * camera.aspect);
    if (need > dist * 1.0001) { pos.sub(tgt).multiplyScalar(need / dist).add(tgt); return viewFor({ pos: pos.toArray(), target: tgt.toArray() }); }
  }
  const visH = 2 * dist * tanH, visW = visH * camera.aspect;
  const sx = -(left / 2) / window.innerWidth * visW;
  const sy = (($('dock').getBoundingClientRect().height + 18) / 2) / window.innerHeight * visH;
  pos.x += sx; tgt.x += sx; pos.y += sy; tgt.y += sy;
  return { pos, tgt };
}
let camTw = null;
function goView(c, instant = false) {
  layoutDock();
  const { pos, tgt } = viewFor(c);
  if (instant) { camTw = null; camera.position.copy(pos); controls.target.copy(tgt); controls.update(); return; }
  camTw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, k: 0 };
}
controls.addEventListener('start', () => { camTw = null; });
$('viewBtn').addEventListener('click', () => goView(TABS[tab].cam()));
$('collapse').addEventListener('click', () => { const c = $('panel').classList.toggle('collapsed'); $('collapse').textContent = c ? '展開' : '收合'; layoutDock(); });
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!w || !h) return;
  renderer.setPixelRatio((window.Look ? window.Look.pixelRatio() : Math.min(window.devicePixelRatio || 1, 2)));
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.fov = 40; camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { resize(); goView(TABS[tab].cam(), true); });

const clock = new THREE.Clock();
function frame(dt) {
  wall += dt;
  TABS[tab].update(dt);
  if (camTw) {
    camTw.k = Math.min(1, camTw.k + dt / 1.3);
    const s = smooth(0, 1, camTw.k);
    camera.position.lerpVectors(camTw.p0, camTw.p1, s);
    controls.target.lerpVectors(camTw.t0, camTw.t1, s);
    if (camTw.k >= 1) camTw = null;
  }
  controls.update();
  if (!window.innerWidth || !window.innerHeight) return;
  placeLabels();
  window.MobileView?.offset(camera);
  renderer.render(scene, camera);
}
function animate() { frame(Math.min(clock.getDelta(), 0.05)); requestAnimationFrame(animate); }

window.lab = { frame, setTab, LF, SC, MS, camera, controls, renderer, scene, placeLabels };

resize();
const first = TABS[location.hash.slice(1)] ? location.hash.slice(1) : 'life';
tab = first;
for (const [k, v] of Object.entries(TABS)) v.group.visible = k === first;
document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === first));
document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== first; });
goView(TABS[first].cam(), true);
animate();
</script>

<script>
setTimeout(() => {
  if (!window.__labReady) {
    document.getElementById('scene').innerHTML = '<div class="fallback">無法載入 Three.js。<br>請確認電腦已連上網路後重新整理。</div>';
  }
}, 6000);
</script>
<script src="goals.js" defer></script>
</body>
</html>
