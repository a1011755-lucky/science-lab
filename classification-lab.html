<!DOCTYPE html>

<title>生物分類實驗室</title>
<style>
  :root {
    --bg: #f5f1e7;
    --ink: #5d4037;
    --ink-soft: #8d7366;
    --card: rgba(255,255,255,.58);
    --accent: #a1674a;
    --ok: #4f7d5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: absolute; inset: 0; }
  #scene canvas { display: block; touch-action: none; }
  .glass {
    background: var(--card); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,.9); box-shadow: 0 18px 44px rgba(93,64,55,.1), 0 2px 6px rgba(93,64,55,.05);
  }
  .panel { position: absolute; top: 18px; left: 18px; width: 318px; max-height: calc(100vh - 36px); overflow-y: auto; z-index: 10; border-radius: 26px; padding: 18px; }
  .panel.collapsed { width: auto; min-width: 240px; }
  .panel.collapsed .body { display: none; }
  .collapse { position: absolute; top: 18px; right: 16px; z-index: 2; cursor: pointer; border: none; font: inherit; font-size: .76rem; font-weight: 600; color: var(--accent); background: rgba(161,103,74,.12); border-radius: 999px; padding: 4px 12px; }
  .back { font-size: .78rem; color: var(--accent); text-decoration: none; }
  .title { font-size: 1.12rem; font-weight: 800; margin-top: 6px; padding-right: 62px; line-height: 1.4; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0 10px; }
  .tab { border: none; cursor: pointer; font: inherit; font-size: .78rem; font-weight: 800; padding: 9px 4px; border-radius: 14px; color: var(--ink); background: rgba(255,255,255,.6); line-height: 1.4; }
  .tab small { display: block; font-weight: 600; opacity: .8; font-size: .68rem; }
  .tab:hover { background: rgba(255,255,255,.95); }
  .tab.on { color: #fff; background: #8d6e63; box-shadow: 0 6px 16px rgba(93,64,55,.25); }
  .sec[hidden] { display: none; }
  .concept { background: rgba(255,255,255,.85); border-radius: 16px; padding: 10px 12px; margin: 2px 0 8px; box-shadow: 0 4px 14px rgba(93,64,55,.07); border-left: 5px solid var(--cc, #8d6e63); }
  .concept .ct { font-size: 1rem; font-weight: 900; color: var(--cc, #8d6e63); }
  .concept .cd { font-size: .82rem; font-weight: 700; margin-top: 2px; line-height: 1.6; }
  .desc { font-size: .78rem; color: var(--ink-soft); line-height: 1.65; margin: 6px 0; }
  .desc b { color: var(--ink); }
  .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: .8rem; font-weight: 800; color: var(--ink-soft); margin-top: 10px; }
  .lab b { font-size: 1.1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  input.big[type=range] { height: 40px; }
  .ticks { display: flex; justify-content: space-between; font-size: .68rem; font-weight: 800; color: var(--ink-soft); margin-top: -4px; }
  select { width: 100%; font: inherit; font-size: .86rem; font-weight: 700; border: 1px solid #e6dccd; border-radius: 12px; padding: 9px 10px; background: rgba(255,255,255,.9); color: var(--ink); margin-top: 4px; }
  .btn {
    width: 100%; border: none; border-radius: 14px; padding: 10px 6px; cursor: pointer; margin-top: 6px;
    font: inherit; font-size: .82rem; font-weight: 700; color: var(--ink); background: rgba(255,255,255,.62);
    transition: background .2s, transform .1s, box-shadow .2s;
  }
  .btn small { display: block; font-weight: 600; font-size: .7rem; opacity: .8; }
  .btn:hover { background: rgba(255,255,255,.95); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.on { color: #fff; background: #a1674a; box-shadow: 0 6px 16px rgba(161,103,74,.28); }
  .btn.primary { color: #fff; background: #5b8a72; box-shadow: 0 6px 16px rgba(79,125,92,.28); font-size: .9rem; padding: 12px 6px; }
  .btn.primary:hover { background: #4f7d65; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { background: rgba(255,255,255,.78); border-radius: 14px; padding: 9px 11px; margin-top: 8px; font-size: .8rem; line-height: 1.75; font-variant-numeric: tabular-nums; }
  .stat b { font-size: .92rem; }
  .stat .r { color: #c62828; } .stat .b { color: #1e6aa8; } .stat .g { color: var(--ok); } .stat .o { color: #d35400; }
  .mapbox { background: rgba(255,255,255,.85); border-radius: 14px; padding: 8px; margin-top: 8px; }
  .mapbox canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  .mapbox p { font-size: .72rem; font-weight: 800; color: var(--ink-soft); margin-bottom: 4px; }

  .dock { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 9; border-radius: 24px; padding: 12px 22px; text-align: center;
          width: max-content; max-width: min(900px, calc(100vw - 380px)); min-width: 300px; }

  .cap small { display: block; font-size: .72rem; color: var(--ink-soft); font-weight: 700; letter-spacing: .06em; }

  .cap .pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

  .cap .chg { font-size: .62em; font-weight: 800; vertical-align: middle; }

  .tag {
    position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%);
    font-size: .74rem; font-weight: 800; padding: 4px 10px; border-radius: 12px; white-space: nowrap; text-align: center; line-height: 1.45;
    background: rgba(255,255,255,.88); color: var(--ink); box-shadow: 0 4px 12px rgba(93,64,55,.1); font-variant-numeric: tabular-nums;
  }
  .tag.red { background: #e53935; color: #fff; }
  .tag.energy { background: #f4a261; color: #fff; font-size: .82rem; }
  .tag.yel { background: #fff3c4; color: #8a6200; border: 1.5px solid #e0b000; }
  .tag.lam { background: #1e6aa8; color: #fff; }
  .tag.depth { background: #d84315; color: #fff; font-size: .82rem; }
  .tag.small { font-size: .64rem; padding: 2px 7px; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-soft); line-height: 1.8; }

  @media (max-width: 768px), (max-width: 1100px) and (orientation: portrait) {
    .dock { top: 8px; bottom: auto; left: 8px; right: 8px; transform: none; max-width: none; min-width: 0; width: auto; padding: 8px 10px; border-radius: 18px; }
    .cap { font-size: .74rem; }
    .cap .huge { font-size: .98rem; }
    .tag { font-size: .62rem; padding: 2px 7px; }
  }
  .tabs.three { grid-template-columns: 1fr 1fr 1fr; }
  .tabs.three .tab { font-size: .72rem; padding: 9px 2px; }
  .objs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  .objs.three { grid-template-columns: repeat(3, 1fr); }
  .objs .btn { padding: 8px 4px; font-size: .78rem; margin-top: 0; }
  .objs .btn.yes { background: #e3f1e6; color: #2e6b3f; } .objs .btn.no { background: #fde5e2; color: #a5311f; }
  .orgcard { background: rgba(255,255,255,.85); border-radius: 16px; padding: 10px 12px; margin-top: 8px; font-size: .8rem; line-height: 1.65; box-shadow: 0 4px 14px rgba(93,64,55,.07); }
  .orgcard:empty { display: none; }
  .orgcard h4 { font-size: .98rem; font-weight: 900; margin-bottom: 2px; }
  .orgcard .pill { display: inline-block; font-size: .72rem; font-weight: 800; color: #fff; background: #7b5ea7; border-radius: 999px; padding: 1px 9px; margin: 2px 4px 2px 0; }
  .orgcard i.sci { font-family: Georgia, serif; }
  .orgcard table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .orgcard td, .orgcard th { padding: 2px 4px; border-bottom: 1px solid #efe6d8; font-size: .74rem; text-align: left; }
  .orgcard tr.same { background: #e3f1e6; } .orgcard tr.diff td { color: #a8998a; }
  .tag.big { font-size: .86rem; }
</style>

<script type="module">
import * as THREE from 'three';
import { enhanceLiquid } from './liquid.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

window.__labReady = true;
const $ = id => document.getElementById(id);
const V3 = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const V2 = (x, y) => new THREE.Vector2(x, y);
const clamp = THREE.MathUtils.clamp;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

/* =========================================================
   溫暖無印風場景：米白背景、木紋桌、柔和光影
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth || 1, window.innerHeight || 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
$('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f1e7);
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0xf6efe2);
const envLight = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
envLight.position.set(3, 5, 4); envLight.scale.setScalar(2.6); envScene.add(envLight);
scene.environment = pmrem.fromScene(envScene, 0.04).texture;
scene.add(new THREE.AmbientLight(0xfff6ea, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.7);
sun.position.set(-7, 16, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 14, bottom: -10, near: 1, far: 50 });
sun.shadow.radius = 7; sun.shadow.bias = -0.0005;
scene.add(sun);
const camera = new THREE.PerspectiveCamera(40, (window.innerWidth || 1) / (window.innerHeight || 1), 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 3; controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.49;

function woodTexture(c1 = '#e2c39b', c2 = '#d6b285') {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, c1); grd.addColorStop(1, c2);
  g.fillStyle = grd; g.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 90; i++) {
    const y = Math.random() * 512;
    g.strokeStyle = `rgba(${140 + Math.random() * 40 | 0},${92 + Math.random() * 30 | 0},${52 + Math.random() * 20 | 0},${0.05 + Math.random() * 0.12})`;
    g.lineWidth = 0.8 + Math.random() * 3;
    g.beginPath();
    for (let x = 0; x <= 1024; x += 16) { const yy = y + Math.sin(x * 0.005 + i) * 7 + Math.sin(x * 0.021 + i * 3) * 2; if (x) g.lineTo(x, yy); else g.moveTo(x, yy); }
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const table = new THREE.Mesh(new RoundedBoxGeometry(34, 0.6, 18, 5, 0.28),
  new THREE.MeshPhysicalMaterial({ map: woodTexture(), roughness: 0.75, clearcoat: 0.2, clearcoatRoughness: 0.5 }));
table.position.set(0, -0.3, 1); table.receiveShadow = true; scene.add(table);

const clay = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.6, metalness: 0, clearcoat: 0.3, clearcoatRoughness: 0.45, ...o });
const metal = (color = 0xc9ccd2, o = {}) => clay(color, { metalness: 0.75, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.15, ...o });
const shadowed = m => { m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; };
const add = (group, mesh, x = 0, y = 0, z = 0) => { mesh.position.set(x, y, z); group.add(mesh); return mesh; };

/* ----- 細圓管繪圖工具（虛線、標線） ----- */
const UNIT_CYL = new THREE.CylinderGeometry(1, 1, 1, 10, 1);
const YUP = V3(0, 1, 0);
const matCache = {};
function basic(color, opacity = 1) {
  const k = color + ':' + opacity;
  return matCache[k] || (matCache[k] = new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: opacity >= 1, toneMapped: false }));
}
function makePool(group, geo) {
  const items = []; let used = 0;
  return {
    begin() { used = 0; },
    get(mat) { let m = items[used]; if (!m) { m = new THREE.Mesh(geo, mat); m.renderOrder = 2; group.add(m); items.push(m); } m.material = mat; m.visible = true; used++; return m; },
    end() { for (let i = used; i < items.length; i++) items[i].visible = false; }
  };
}
const tmpD = V3(0, 0, 0);
function placeSeg(m, a, b, r) {
  tmpD.copy(b).sub(a); const len = tmpD.length();
  m.position.copy(a).add(b).multiplyScalar(0.5);
  if (len > 1e-6) m.quaternion.setFromUnitVectors(YUP, tmpD.divideScalar(len));
  m.scale.set(r, Math.max(len, 1e-4), r);
}
function Drawer(group) {
  const tubes = makePool(group, UNIT_CYL);
  return {
    begin() { tubes.begin(); },
    end() { tubes.end(); },
    line(a, b, color, r = 0.04, opacity = 1) { placeSeg(tubes.get(basic(color, opacity)), a, b, r); },
    dash(a, b, color, { r = 0.035, on = 0.22, off = 0.14, opacity = 1 } = {}) {
      const len = a.distanceTo(b); if (len < 1e-4) return;
      const dir = b.clone().sub(a).divideScalar(len);
      for (let s = 0; s < len; s += on + off) {
        const p0 = a.clone().addScaledVector(dir, s), p1 = a.clone().addScaledVector(dir, Math.min(len, s + on));
        placeSeg(tubes.get(basic(color, opacity)), p0, p1, r);
      }
    }
  };
}
/** 圓點貼圖（粒子用） */
function dotTexture(fill = '#ffffff', rim = 'rgba(120,130,150,.75)') {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.beginPath(); g.arc(32, 32, 26, 0, TAU); g.fillStyle = fill; g.fill();
  g.lineWidth = 6; g.strokeStyle = rim; g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function glowTexture(rgb = '255,80,60') {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, `rgba(${rgb},.75)`); grd.addColorStop(0.35, `rgba(${rgb},.32)`); grd.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
/** 記錄「波源過去的位移」：波傳到 x 處的位移 = 波源在 (t − x / V) 時的位移 */
function makeHist() { return { t: [], v: [] }; }
function pushHist(h, t, v, keep) {
  h.t.push(t); h.v.push(v);
  while (h.t.length > 2 && h.t[1] < t - keep) { h.t.shift(); h.v.shift(); }
}
function sampleHist(h, tq) {
  const T = h.t, n = T.length;
  if (!n || tq < T[0]) return 0;
  if (tq >= T[n - 1]) return h.v[n - 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (T[m] <= tq) lo = m; else hi = m; }
  const k = (tq - T[lo]) / Math.max(1e-9, T[hi] - T[lo]);
  return h.v[lo] + (h.v[hi] - h.v[lo]) * k;
}

/* ----- 浮動標籤 ----- */
const labels = [];
const tmpV = V3(0, 0, 0), tmpW = V3(0, 0, 0);
function addLabel(tabKey, html, cls, off, follow = null) {
  const el = document.createElement('div'); el.className = 'tag ' + (cls || ''); el.innerHTML = html; document.body.appendChild(el);
  const L = { tab: tabKey, el, html, cls: cls || '', off: off.clone(), pos: off.clone(), follow, show: true }; labels.push(L); return L;
}
function setLabel(L, html, cls) {
  if (L.html !== html) { L.html = html; L.el.innerHTML = html; }
  if (cls !== undefined && L.cls !== cls) { L.cls = cls; L.el.className = 'tag ' + cls; }
}
function placeLabels() {
  const w = window.innerWidth, h = window.innerHeight;
  for (const L of labels) {
    if (L.tab !== tab || !L.show) { L.el.style.display = 'none'; continue; }
    if (L.follow) L.pos.copy(L.follow.getWorldPosition(tmpW)).add(L.off);
    tmpV.copy(L.pos).project(camera);
    if (tmpV.z > 1) { L.el.style.display = 'none'; continue; }
    L.el.style.display = '';
    L.el.style.left = ((tmpV.x + 1) / 2 * w) + 'px';
    L.el.style.top = ((1 - tmpV.y) / 2 * h) + 'px';
  }
}
let tab = 'rank', wall = 0;
const setCap = html => { if ($('cap').innerHTML !== html) $('cap').innerHTML = html; };
const setHTML = (id, html) => { if ($(id).innerHTML !== html) $(id).innerHTML = html; };

/* =========================================================
   共用小工具
   ========================================================= */
const lerp = (a, b, k) => a + (b - a) * k;
const cyl = (r1, r2, h, mat, seg = 32) => new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat);

    const gName = k => D[st.kind].groups.find(g => g[0] === k);
    setHTML('gpQ', st.i < list.length ? `${o[1]} <b>${o[0]}</b> 屬於哪一類？` : `<b>全部分類完成！</b>`);
    setHTML('gpRes', st.wrong ? `❌ 不是${gName(st.wrong)[1]}：${gName(st.wrong)[2]}。再想想！` : st.i > 0 && st.fly === 0 && st.i <= list.length ? `✅ ${list[st.order[st.i - 1]][0]}是<b>${gName(list[st.order[st.i - 1]][2])[1]}</b>：${gName(list[st.order[st.i - 1]][2])[2]}` : '');
    setHTML('gpScore', `進度 <b>${Math.min(st.i, list.length)} / ${list.length}</b>　答對率 <b>${st.tries ? Math.round(st.score / st.tries * 100) : 0}%</b>`);
    setCap(st.kind === 'plant' ? '<small>植物界</small>蘚苔 → 蕨類 → 裸子 → 被子：看有沒有<b>維管束</b>、<b>種子</b>、<b>花和果實</b>' : '<small>動物界</small>無脊椎動物（刺絲胞、軟體、環節、節肢、棘皮）與脊椎動物（魚、兩生、爬蟲、鳥、哺乳）');
  }
  return { group, update, st, start };
})();
function updateGrp(dt) { GP.update(dt); }

/* =========================================================
   Tab 切換、鏡頭
   ========================================================= */
const TABS = {
  rank: { group: RK.group, cam: () => ({ pos: [0.8, 4.0, 10.5], target: [0.6, 2.0, 0], fitW: window.innerWidth < window.innerHeight ? 12.5 : 12.8 }), update: updateRank },
  king: { group: KG.group, cam: () => ({ pos: [0, 4.4, 9.5], target: [0, 1.4, 0], fitW: window.innerWidth < window.innerHeight ? 9.6 : 9.5 }), update: updateKing },
  grp: { group: GP.group, cam: () => ({ pos: [0, 5.2, 9.5], target: [0, 1.5, 0.4], fitW: window.innerWidth < window.innerHeight ? 10.2 : 10.5 }), update: updateGrp }
};
function setTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== t; });
  for (const [k, v] of Object.entries(TABS)) v.group.visible = k === t;
  
  renderer.domElement.style.cursor = '';
  goView(TABS[t].cam());
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* file:// */ }
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
function layoutDock() {
  const d = $('dock');
  if (window.MobileView?.isMobile()) { d.style.left = ''; d.style.maxWidth = ''; return; }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  d.style.left = ((left + window.innerWidth) / 2) + 'px';
  d.style.maxWidth = Math.max(300, window.innerWidth - left - 28) + 'px';
}
function viewFor(c) {
  const pos = V3(...c.pos), tgt = V3(...c.target);
  if (!window.innerWidth || !window.innerHeight) return { pos, tgt };
  if (window.MobileView?.isMobile()) {
    const dist = pos.distanceTo(tgt), tanH = Math.tan(Math.min(camera.fov, 50) * Math.PI / 360);
    const need = (c.fitW || 0) * 1.08 / (2 * tanH * camera.aspect);
    if (need > dist) pos.sub(tgt).multiplyScalar(need / dist).add(tgt);
    return { pos, tgt };
  }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  const dist = pos.distanceTo(tgt), tanH = Math.tan(camera.fov * Math.PI / 360);
  if (c.fitW) {
    const avail = Math.max(0.35, (window.innerWidth - left) / window.innerWidth);
    const need = c.fitW / avail / (2 * tanH * camera.aspect);
    if (need > dist * 1.0001) { pos.sub(tgt).multiplyScalar(need / dist).add(tgt); return viewFor({ pos: pos.toArray(), target: tgt.toArray() }); }
  }
  const visH = 2 * dist * tanH, visW = visH * camera.aspect;
  const sx = -(left / 2) / window.innerWidth * visW;
  const sy = (($('dock').getBoundingClientRect().height + 18) / 2) / window.innerHeight * visH;
  pos.x += sx; tgt.x += sx; pos.y += sy; tgt.y += sy;
  return { pos, tgt };
}
let camTw = null;
function goView(c, instant = false) {
  layoutDock();
  const { pos, tgt } = viewFor(c);
  if (instant) { camTw = null; camera.position.copy(pos); controls.target.copy(tgt); controls.update(); return; }
  camTw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, k: 0 };
}
controls.addEventListener('start', () => { camTw = null; });
$('viewBtn').addEventListener('click', () => goView(TABS[tab].cam()));
$('collapse').addEventListener('click', () => { const c = $('panel').classList.toggle('collapsed'); $('collapse').textContent = c ? '展開' : '收合'; layoutDock(); });
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!w || !h) return;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.fov = 40; camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { resize(); goView(TABS[tab].cam(), true); });

const clock = new THREE.Clock();
function frame(dt) {
  wall += dt;
  TABS[tab].update(dt);
  if (camTw) {
    camTw.k = Math.min(1, camTw.k + dt / 1.3);
    const s = smooth(0, 1, camTw.k);
    camera.position.lerpVectors(camTw.p0, camTw.p1, s);
    controls.target.lerpVectors(camTw.t0, camTw.t1, s);
    if (camTw.k >= 1) camTw = null;
  }
  controls.update();
  if (!window.innerWidth || !window.innerHeight) return;
  placeLabels();
  window.MobileView?.offset(camera);
  renderer.render(scene, camera);
}
function animate() { frame(Math.min(clock.getDelta(), 0.05)); requestAnimationFrame(animate); }

window.lab = { frame, setTab, RK, KG, GP, camera, controls, renderer, scene, placeLabels };

resize();
const first = TABS[location.hash.slice(1)] ? location.hash.slice(1) : 'rank';
tab = first;
for (const [k, v] of Object.entries(TABS)) v.group.visible = k === first;
document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === first));
document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== first; });
goView(TABS[first].cam(), true);
animate();
</script>

<script>
setTimeout(() => {
  if (!window.__labReady) {
    document.getElementById('scene').innerHTML = '<div class="fallback">無法載入 Three.js。<br>請確認電腦已連上網路後重新整理。</div>';
  }
}, 6000);
</script>
<script src="goals.js" defer></script>
<script src="stats.js" defer></script>
</body>
