<title>簡單機械：滑輪、斜面與輪軸</title>
<style>
  :root {

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  }
  #scene { position: absolute; inset: 0; }

  .mapbox { background: rgba(255,255,255,.85); border-radius: 14px; padding: 8px; margin-top: 8px; }
  .mapbox canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  .mapbox p { font-size: .72rem; font-weight: 800; color: var(--ink-soft); margin-bottom: 4px; }

  .dock { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 9; border-radius: 24px; padding: 12px 22px; text-align: center;
          width: max-content; max-width: min(900px, calc(100vw - 380px)); min-width: 300px; }

    .dock { top: 8px; bottom: auto; left: 8px; right: 8px; transform: none; max-width: none; min-width: 0; width: auto; padding: 8px 10px; border-radius: 18px; }

  .tabs.three { grid-template-columns: 1fr 1fr 1fr; }
  .tabs.three .tab { font-size: .72rem; padding: 9px 2px; }
  .objs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  .objs.three { grid-template-columns: repeat(3, 1fr); }
  .objs .btn { padding: 8px 4px; font-size: .78rem; margin-top: 0; }
  .objs .btn.yes { background: #e3f1e6; color: #2e6b3f; } .objs .btn.no { background: #fde5e2; color: #a5311f; }
  .orgcard { background: rgba(255,255,255,.85); border-radius: 16px; padding: 10px 12px; margin-top: 8px; font-size: .8rem; line-height: 1.65; box-shadow: 0 4px 14px rgba(93,64,55,.07); }
  .orgcard:empty { display: none; }
  .orgcard h4 { font-size: .98rem; font-weight: 900; margin-bottom: 2px; }
  .orgcard .pill { display: inline-block; font-size: .72rem; font-weight: 800; color: #fff; background: #7b5ea7; border-radius: 999px; padding: 1px 9px; margin: 2px 4px 2px 0; }
  .orgcard i.sci { font-family: Georgia, serif; }
  .orgcard table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .orgcard td, .orgcard th { padding: 2px 4px; border-bottom: 1px solid #efe6d8; font-size: .74rem; text-align: left; }
  .orgcard tr.same { background: #e3f1e6; } .orgcard tr.diff td { color: #a8998a; }
  .tag.big { font-size: .86rem; }
  .stat table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: .74rem; }
  .stat td, .stat th { padding: 3px 3px; border-bottom: 1px solid #efe6d8; text-align: left; white-space: nowrap; }
  .stat tr.same { background: #e3f1e6; }
  .tip { background: #fff3c4; color: #7a5300; border: 1.5px solid #e0b000; border-radius: 14px; padding: 9px 11px; margin-top: 8px; font-size: .82rem; font-weight: 800; line-height: 1.6; animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .tip[hidden], .mapbox[hidden], .btn[hidden] { display: none; }
  .ticks span:first-child { text-align: left; } .ticks span:last-child { text-align: right; }
  .meter { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: .74rem; font-weight: 800; color: var(--ink-soft); }
  .meter i { flex: 1; height: 16px; border-radius: 999px; background: linear-gradient(90deg, #f7efe6, #8b2e0f); position: relative; }
  .meter i::after { content: ''; position: absolute; top: -4px; width: 6px; height: 24px; border-radius: 3px; background: var(--ink); left: var(--v, 50%); transform: translateX(-50%); transition: left .2s; }
  .cap .eq { display: inline-flex; align-items: center; gap: 6px; font-size: 1.05em; font-weight: 900; }
  .cap .arrs { display: inline-flex; flex-direction: column; line-height: .9; font-size: 1.1em; }
  .cap .arrs span { opacity: .28; transition: opacity .3s, color .3s, transform .3s; }
  .cap .arrs span.on { opacity: 1; color: #c62828; transform: scale(1.35); }
  .cap .brown { color: #8b2e0f; }
  .legend { display: flex; gap: 6px; margin: 8px 0 2px; font-size: .72rem; font-weight: 800; }
  .legend .lg { flex: 1; text-align: center; border-radius: 999px; padding: 3px 0; color: #fff; }
  .legend .f { background: #ff2d2d; } .legend .a { background: #22c55e; } .legend .w { background: #424242; } .legend .n { background: #29b6f6; }
  .tag.vA { background: #16a34a; color: #fff; font-weight: 900; } .tag.vN { background: #29b6f6; color: #fff; font-weight: 900; }
  .formula { font-size: 1.02rem; font-weight: 900; background: #fff1c9; border-radius: 10px; padding: 5px 8px; margin-bottom: 4px; text-align: center; } .bbtn.on { background: #fff1c9; box-shadow: 0 0 0 2px #f0b429 inset; color: #5d4037; }
  .tag.vF { background: #ff2d2d; color: #fff; font-weight: 900; } .tag.vS { background: #29b6f6; color: #fff; font-weight: 900; } .tag.vW { background: #424242; color: #fff; font-weight: 900; } .tag.org { background: #ef6c00; color: #fff; font-weight: 900; }
  .tip.ok { background: #e3f1e6; color: #1f5f32; border-color: #3f9a57; } .tip.bad { background: #fde5e2; color: #a5311f; border-color: #e53935; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .half { background: rgba(255,255,255,.85); border-radius: 14px; padding: 8px 9px; font-size: .76rem; line-height: 1.6; box-shadow: 0 4px 14px rgba(93,64,55,.07); }
  .half h4 { font-size: .86rem; font-weight: 900; margin-bottom: 2px; }
  .half .res { margin-top: 4px; font-weight: 900; font-size: .9rem; border-radius: 10px; padding: 3px 6px; text-align: center; }
  .half .res.pos { background: #e3f1e6; color: #1f5f32; } .half .res.neg { background: #fde5e2; color: #a5311f; } .half .res.zero { background: #efe9df; color: #7a6a5a; }
  .legend .piv { background: #e0b800; } .legend .tq { background: #ff8a1f; }
  .lvbtn.on { background: #fff1c9; box-shadow: 0 0 0 2px #f0b429 inset; color: #5d4037; }
  .stat b.g { color: #2e7d32; } .stat b.r { color: #e53935; }
  /* 毛玻璃：本頁規格 */
  .panel.glass, .dock.glass, .skyBox.glass { background: rgba(255,255,255,0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; color: #5d4037; }
  .scaleNote { position: fixed; right: 14px; bottom: 10px; z-index: 9; font-size: .72rem; font-weight: 700; color: #8d6e63; background: rgba(255,255,255,.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; padding: 4px 10px; }
  .skyBox { position: fixed; right: 16px; top: 16px; z-index: 9; width: 236px; padding: 8px; }
  .skyBox[hidden] { display: none; }
  .skyBox canvas { width: 100%; height: auto; border-radius: 10px; display: block; margin: 5px 0; }
  .skyT { font-size: .76rem; font-weight: 700; line-height: 1.4; }
  .row2.mini .btn { font-size: .7rem; padding: 5px 2px; margin-top: 0; }
  .hint { font-size: .72rem; color: #8d6e63; background: rgba(255,255,255,.55); border-radius: 10px; padding: 5px 8px; margin: 6px 0 8px; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; margin-top: 8px; cursor: pointer; }
  .chk input { width: 17px; height: 17px; accent-color: #8d6e63; }
  .cards { display: grid; gap: 5px; margin-top: 8px; }
  .cards .card { background: rgba(255,255,255,.72); border-radius: 12px; padding: 6px 9px; font-size: .78rem; line-height: 1.55; box-shadow: 0 3px 10px rgba(93,64,55,.06); }
  .terms { margin-top: 8px; background: rgba(255,255,255,.72); border-radius: 12px; padding: 7px 9px; font-size: .76rem; line-height: 1.7; }
  .ph4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; } .ph4 .btn { margin-top: 0; padding: 8px 2px; }
  .tcurve { width: 100%; height: 150px; display: block; margin-top: 8px; border-radius: 10px; }
  .tw { margin-top: 8px; background: rgba(255,255,255,.72); border-radius: 12px; padding: 6px 9px; font-size: .78rem; }
  .tw summary { font-weight: 800; cursor: pointer; }
  .twmap { width: 100%; height: auto; margin-top: 6px; }
  .tip.gold { background: #fff4d6; color: #7a5300; border-color: #f0b429; } .tip.red { background: #fde5e2; color: #a5311f; border-color: #e53935; }
  .ticks { display: flex; justify-content: space-between; }
  .tag.sunL { background: #fff1c2; color: #8a5a00; } .tag.umb { background: #3d3d3d; color: #fff; } .tag.pen { background: #cfcfcf; color: #333; }
  .tag.eclL { background: #ffe0b2; color: #8a4b00; } .tag.wdL { background: #d6e9ff; color: #0b4d9a; } .tag.nodeL { background: #ffd8c9; color: #b23c17; }
  .tag.pullL { background: #ff3b30; color: #fff; } .tag.sunPullL { background: #ffd59e; color: #8a4b00; } .tag.seaL { background: #d8efff; color: #0d5ea8; } .tag.portL { background: #fff; color: #b71c1c; }
  .tag.hiL { background: #1565c0; color: #fff; } .tag.loL { background: #ef6c00; color: #fff; } .tag.bandL { background: #dcedc8; color: #33691e; }
  .tag.nowL { font-size: .86rem; font-weight: 900; } .tag.nowL.hi { background: #1565c0; color: #fff; } .tag.nowL.lo { background: #ef6c00; color: #fff; } .tag.nowL.up { background: #d8efff; color: #0d5ea8; } .tag.nowL.down { background: #ffe9d6; color: #a14a00; }
  .stat b.r { color: #e53935; }
  .legend.ml .f { background: #ff3b30; } .legend.ml .s { background: #2ec5e6; } .legend.ml .w { background: #8e44ad; }

<body data-mv-start="closed">

<div id="scene"></div>
<div class="dock glass" id="dock"><div class="cap" id="cap"></div></div>
<div class="scaleNote" id="scaleNote">不計摩擦與滑輪、繩子的重量</div>

<aside class="panel glass" id="panel">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">‹ 課程總覽</a>
  <div class="title">簡單機械：滑輪、斜面與輪軸</div>
  <div class="body">
    <div class="tabs three">
      <button class="tab on" data-tab="pulley">🪝 滑輪<small>定滑輪・動滑輪</small></button>
      <button class="tab" data-tab="ramp">📐 斜面<small>F × L ＝ W × h</small></button>
      <button class="tab" data-tab="axle">☸️ 輪軸<small>F × R ＝ W × r</small></button>
    </div>
    <div class="legend ml"><span class="lg f">施力</span><span class="lg s">位移</span><span class="lg w">物重</span></div>
    <div class="hint">槓桿請見「力矩與槓桿」實驗室。</div>

    <!-- Tab 1 -->
    <section class="sec" data-tab="pulley">
      <label class="lab" for="plW">📦 物重 W<b><span id="plWV">60</span> N</b></label>
      <input class="big" type="range" id="plW" min="10" max="100" step="10" value="60">
      <label class="lab" for="plP">⬆️ 提升進度（木箱上升 1 m）<b id="plPV">50 %</b></label>
      <input class="big" type="range" id="plP" min="0" max="100" step="1" value="50">
      <div class="stat" id="plStat"></div>
      <div class="cards">
        <div class="card">🪝 <b>定滑輪</b>：不省力，但能改變施力方向</div>
        <div class="card">🔁 <b>動滑輪</b>：省一半力，但繩子要拉兩倍長</div>
        <div class="card">⚖️ <b>省力不省功！</b></div>
      </div>
    </section>

    <!-- Tab 2 -->
    <section class="sec" data-tab="ramp" hidden>
      <label class="lab" for="rpW">📦 物重 W<b><span id="rpWV">60</span> N</b></label>
      <input class="big" type="range" id="rpW" min="10" max="100" step="10" value="60">
      <label class="lab" for="rpL">📏 斜面長 L（高度固定 1 m）<b><span id="rpLV">3.0</span> m</b></label>
      <input class="big" type="range" id="rpL" min="1" max="5" step="0.5" value="3">
      <label class="lab" for="rpP">➡️ 推動進度<b id="rpPV">60 %</b></label>
      <input class="big" type="range" id="rpP" min="0" max="100" step="1" value="60">
      <div class="stat" id="rpStat"></div>
      <div class="cards">
        <div class="card">📐 斜面越長越省力，但要推得越遠</div>
        <div class="card">♿ 生活例子：無障礙坡道、螺絲</div>
        <div class="card">⚖️ 省力不省功！</div>
      </div>
    </section>

    <!-- Tab 3 -->
    <section class="sec" data-tab="axle" hidden>
      <label class="lab" for="axW">📦 物重 W<b><span id="axWV">60</span> N</b></label>
      <input class="big" type="range" id="axW" min="10" max="100" step="10" value="60">

      <label class="lab" for="axP">🔄 轉動進度（一圈）<b id="axPV">40 %</b></label>
      <input class="big" type="range" id="axP" min="0" max="100" step="1" value="40">

const AX = (() => {

  // 木架
  { const p = shadowed(new THREE.Mesh(new RoundedBoxGeometry(0.34, CY + 0.35, 0.3, 3, 0.05), WD(0xb88a5a))); p.position.set(0, (CY + 0.35) / 2, -1.25); group.add(p);
    const brg = shadowed(new THREE.Mesh(new RoundedBoxGeometry(0.6, 0.6, 0.34, 3, 0.08), WD(0xa47a4a))); brg.position.set(0, CY, -1.15); group.add(brg); }

  const marks = new THREE.Group(); axle.add(marks);                                     // 軸上的記號：看得出軸也在轉
  { const m = new THREE.Mesh(new THREE.BoxGeometry(0.05, r * SC * 2.02, 0.5), WD(0x7a5230)); m.position.z = -0.4; marks.add(m); }
  // 大輪（輪轉一圈，軸也轉一圈）
  const wheelG = new THREE.Group(); wheelG.position.z = 0.75; axle.add(wheelG);
  const wheelParts = new THREE.Group(); wheelG.add(wheelParts);
  const knob = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.35, 16), WD(0x8d6e4a))); knob.rotation.x = Math.PI / 2; wheelG.add(knob);
  const trail = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ color: C_S, toneMapped: false, transparent: true, opacity: 0.9 })); trail.position.set(0, CY, 0.95); group.add(trail);
  const cr = crate(CS); group.add(cr);
  const ropeA = rope(group);
  const aF = Arrow(C_F), aW = Arrow(C_W), aS = Arrow(C_S, 0.045);
  group.add(aF, aW, aS);
  const lF = addLabel('axle', '', 'small lF', V3(0, 0, 0)), lW = addLabel('axle', '', 'small lW', V3(0, 0, 0)), lR = addLabel('axle', '', 'small', V3(0, 0, 0)), lT = addLabel('axle', '', 'small lS', V3(0, 0, 0)), lS = addLabel('axle', '', 'small lS', V3(0, 0, 0));
  const gW = sliderVal('axW'), gR = sliderVal('axR', v => v), gP = sliderVal('axP', v => v + ' %');
  let key = '', Ru = 1;
  const put = (lab, p) => { lab.pos.copy(p); lab.off.copy(p); };
  function buildWheel(R) {
    while (wheelParts.children.length) { const c = wheelParts.children.pop(); c.geometry.dispose(); }
    Ru = R * SC;
    const rim = new THREE.Mesh(new THREE.TorusGeometry(Ru, 0.07, 14, 80), WD()); wheelParts.add(rim);
    const n = 6; for (let i = 0; i < n; i++) { const s = new THREE.Mesh(new THREE.BoxGeometry(0.07, Ru, 0.06), WD(0xc49a6c)); s.position.set(Math.cos(i / n * Math.PI * 2) * Ru / 2, Math.sin(i / n * Math.PI * 2) * Ru / 2, 0); s.rotation.z = i / n * Math.PI * 2 - Math.PI / 2; wheelParts.add(s); }

    cr.position.set(cx, cy, 0); stick(ropeA, V3(cx, cy + CS + 0.12, 0), V3(cx, CY, 0));

    setLabel(lW, `物重 W ＝ ${f1(W)} N`); put(lW, V3(cx - 1.3, cy + CS * 0.3, 0.5));
    setLabel(lR, `輪半徑 R ＝ ${f1(R * 100)} cm｜軸半徑 r ＝ 5.0 cm`); put(lR, V3(0, CY + Ru + 0.65, 0.8));
    const sF = 2 * Math.PI * R * p, sW = 2 * Math.PI * r * p;
    setLabel(lT, `施力點移動 ${f1(sF * 100)} cm`); lT.show = p > 0.03; put(lT, V3(Ru * 0.75 + 0.8, CY - Ru * 0.75, 0.95));
    setLabel(lS, `木箱上升 ${f1(sW * 100)} cm`); lS.show = p > 0.03; put(lS, V3(cx - 1.6, 0.15 + CS / 2 + lift / 2, 0.4));
    setHTML('axStat', `<div class="formula">施力 × 輪半徑 ＝ 物重 × 軸半徑</div>F × ${f1(R * 100)} ＝ ${f1(W)} × 5.0　→　<b class="r">F ＝ ${f1(F)} N</b>
      <table class="cmp"><tr><th></th><th>大輪（施力）</th><th>小軸（物重）</th></tr>
      <tr><td>力</td><td><b class="r">${f1(F)} N</b></td><td><b>${f1(W)} N</b></td></tr>
      <tr><td>轉了</td><td>${f1(p)} 圈</td><td>${f1(p)} 圈</td></tr>
      <tr><td>移動距離</td><td><b class="b">${f1(sF * 100)} cm</b></td><td><b class="b">${f1(sW * 100)} cm</b></td></tr>
      <tr><td>作功</td><td><b>${f1(F * sF)} J</b></td><td><b>${f1(W * sW)} J</b></td></tr></table>
      <small>輪轉一圈，軸也轉一圈；施力點走 2 × 3.14 × R，木箱只上升 2 × 3.14 × r。</small>`);
    setCap(`<small>輪軸・R ＝ ${f1(R * 100)} cm、r ＝ 5.0 cm</small>施力 ${f1(F)} N 就能舉起 ${f1(W)} N<span class="huge grn">施力在大輪上：省力但費時</span>`);
  }

/* =========================================================
   Tab 切換、鏡頭
   ========================================================= */
const TABS = {
  pulley: { group: PL.group, cam: () => ({ pos: [0, 4.2, 12.5], target: [0, 2.9, 0], fitW: window.innerWidth < window.innerHeight ? 10.5 : 11.5 }), update: PL.update },
  ramp: { group: RP.group, cam: () => ({ pos: [-1.2, 3.6, 11.5], target: [-1.6, 1.0, 0], fitW: window.innerWidth < window.innerHeight ? 10.5 : 12 }), update: RP.update },
  axle: { group: AX.group, cam: () => ({ pos: [2.2, 4.6, 9.5], target: [0, 2.4, 0], fitW: window.innerWidth < window.innerHeight ? 7.5 : 8.5 }), update: AX.update }
};
function setTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== t; });
  for (const [k, v] of Object.entries(TABS)) v.group.visible = k === t;
  onTabChange(t);
  renderer.domElement.style.cursor = '';
  goView(TABS[t].cam());
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* file:// */ }
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
function layoutDock() {
  const d = $('dock');
  if (window.MobileView?.isMobile()) { d.style.left = ''; d.style.maxWidth = ''; return; }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  d.style.left = ((left + window.innerWidth) / 2) + 'px';
  d.style.maxWidth = Math.max(300, window.innerWidth - left - 28) + 'px';
}
function viewFor(c) {
  const pos = V3(...c.pos), tgt = V3(...c.target);
  if (!window.innerWidth || !window.innerHeight) return { pos, tgt };
  if (window.MobileView?.isMobile()) {
    const dist = pos.distanceTo(tgt), tanH = Math.tan(Math.min(camera.fov, 50) * Math.PI / 360);
    const need = (c.fitW || 0) * 1.08 / (2 * tanH * camera.aspect);
    if (need > dist) pos.sub(tgt).multiplyScalar(need / dist).add(tgt);
    return { pos, tgt };
  }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  const dist = pos.distanceTo(tgt), tanH = Math.tan(camera.fov * Math.PI / 360);
  if (c.fitW) {
    const avail = Math.max(0.35, (window.innerWidth - left) / window.innerWidth);
    const need = c.fitW / avail / (2 * tanH * camera.aspect);
    if (need > dist * 1.0001) { pos.sub(tgt).multiplyScalar(need / dist).add(tgt); return viewFor({ pos: pos.toArray(), target: tgt.toArray() }); }
  }
  const visH = 2 * dist * tanH, visW = visH * camera.aspect;
  const sx = -(left / 2) / window.innerWidth * visW;
  const sy = (($('dock').getBoundingClientRect().height + 18) / 2) / window.innerHeight * visH;
  pos.x += sx; tgt.x += sx; pos.y += sy; tgt.y += sy;
  return { pos, tgt };
}
let camTw = null;
function goView(c, instant = false) {
  layoutDock();
  const { pos, tgt } = viewFor(c);
  if (instant) { camTw = null; camera.position.copy(pos); controls.target.copy(tgt); controls.update(); return; }
  camTw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, k: 0 };
}
controls.addEventListener('start', () => { camTw = null; });
$('viewBtn').addEventListener('click', () => goView(TABS[tab].cam()));
$('collapse').addEventListener('click', () => { const c = $('panel').classList.toggle('collapsed'); $('collapse').textContent = c ? '展開' : '收合'; layoutDock(); });
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!w || !h) return;
  renderer.setPixelRatio((window.Look ? window.Look.pixelRatio() : Math.min(window.devicePixelRatio || 1, 2)));
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.fov = 40; camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { resize(); goView(TABS[tab].cam(), true); });

const clock = new THREE.Clock();
function frame(dt) {
  wall += dt;
  TABS[tab].update(dt);
  if (camTw) {
    camTw.k = Math.min(1, camTw.k + dt / 1.3);
    const s = smooth(0, 1, camTw.k);
    camera.position.lerpVectors(camTw.p0, camTw.p1, s);
    controls.target.lerpVectors(camTw.t0, camTw.t1, s);
    if (camTw.k >= 1) camTw = null;
  }
  controls.update();
  if (!window.innerWidth || !window.innerHeight) return;
  placeLabels();
  window.MobileView?.offset(camera);
  renderer.render(scene, camera);
}
function animate() { frame(Math.min(clock.getDelta(), 0.05)); requestAnimationFrame(animate); }

window.lab = { frame, setTab, PL, RP, AX, camera, controls, renderer, scene, placeLabels };

resize();
const first = TABS[location.hash.slice(1)] ? location.hash.slice(1) : 'pulley';
tab = first;
for (const [k, v] of Object.entries(TABS)) v.group.visible = k === first;
document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === first));
document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== first; });
goView(TABS[first].cam(), true);
animate();
</script>

<script>
setTimeout(() => {
  if (!window.__labReady) {
    document.getElementById('scene').innerHTML = '<div class="fallback">無法載入 Three.js。<br>請確認電腦已連上網路後重新整理。</div>';
  }
}, 6000);
</script>
<script src="goals.js" defer></script>
</body>
