<script type="module">
import * as THREE from 'three';
import { enhanceLiquid } from './liquid.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

window.__labReady = true;
const $ = id => document.getElementById(id);
const V3 = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const V2 = (x, y) => new THREE.Vector2(x, y);
const clamp = THREE.MathUtils.clamp;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

/* =========================================================
   溫暖無印風場景：米白背景、木紋桌、柔和光影
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setPixelRatio((window.Look ? window.Look.pixelRatio() : Math.min(window.devicePixelRatio || 1, 2)));
renderer.setSize(window.innerWidth || 1, window.innerHeight || 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
$('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f1e7);
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0xf6efe2);
const envLight = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
envLight.position.set(3, 5, 4); envLight.scale.setScalar(2.6); envScene.add(envLight);
scene.environment = pmrem.fromScene(envScene, 0.04).texture;
scene.add(new THREE.AmbientLight(0xfff6ea, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.7);
sun.position.set(-7, 16, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 14, bottom: -10, near: 1, far: 50 });
sun.shadow.radius = 7; sun.shadow.bias = -0.0005;
scene.add(sun);
const camera = new THREE.PerspectiveCamera(40, (window.innerWidth || 1) / (window.innerHeight || 1), 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 3; controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.49;

function woodTexture(c1 = '#e2c39b', c2 = '#d6b285') {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, c1); grd.addColorStop(1, c2);
  g.fillStyle = grd; g.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 90; i++) {
    const y = Math.random() * 512;
    g.strokeStyle = `rgba(${140 + Math.random() * 40 | 0},${92 + Math.random() * 30 | 0},${52 + Math.random() * 20 | 0},${0.05 + Math.random() * 0.12})`;
    g.lineWidth = 0.8 + Math.random() * 3;
    g.beginPath();
    for (let x = 0; x <= 1024; x += 16) { const yy = y + Math.sin(x * 0.005 + i) * 7 + Math.sin(x * 0.021 + i * 3) * 2; if (x) g.lineTo(x, yy); else g.moveTo(x, yy); }
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const table = new THREE.Mesh(new RoundedBoxGeometry(34, 0.6, 18, 5, 0.28),
  new THREE.MeshPhysicalMaterial({ map: woodTexture(), roughness: 0.75, clearcoat: 0.2, clearcoatRoughness: 0.5 }));
table.position.set(0, -0.3, 1); table.receiveShadow = true; scene.add(table);

const clay = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.6, metalness: 0, clearcoat: 0.3, clearcoatRoughness: 0.45, ...o });
const metal = (color = 0xc9ccd2, o = {}) => clay(color, { metalness: 0.75, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.15, ...o });
const shadowed = m => { m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; };
const add = (group, mesh, x = 0, y = 0, z = 0) => { mesh.position.set(x, y, z); group.add(mesh); return mesh; };

/* ----- 細圓管繪圖工具（虛線、標線） ----- */
const UNIT_CYL = new THREE.CylinderGeometry(1, 1, 1, 10, 1);
const YUP = V3(0, 1, 0);
const matCache = {};
function basic(color, opacity = 1) {
  const k = color + ':' + opacity;
  return matCache[k] || (matCache[k] = new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: opacity >= 1, toneMapped: false }));
}
function makePool(group, geo) {
  const items = []; let used = 0;
  return {
    begin() { used = 0; },
    get(mat) { let m = items[used]; if (!m) { m = new THREE.Mesh(geo, mat); m.renderOrder = 2; group.add(m); items.push(m); } m.material = mat; m.visible = true; used++; return m; },
    end() { for (let i = used; i < items.length; i++) items[i].visible = false; }
  };
}
const tmpD = V3(0, 0, 0);
function placeSeg(m, a, b, r) {
  tmpD.copy(b).sub(a); const len = tmpD.length();
  m.position.copy(a).add(b).multiplyScalar(0.5);
  if (len > 1e-6) m.quaternion.setFromUnitVectors(YUP, tmpD.divideScalar(len));
  m.scale.set(r, Math.max(len, 1e-4), r);
}
function Drawer(group) {
  const tubes = makePool(group, UNIT_CYL);
  return {
    begin() { tubes.begin(); },
    end() { tubes.end(); },
    line(a, b, color, r = 0.04, opacity = 1) { placeSeg(tubes.get(basic(color, opacity)), a, b, r); },
    dash(a, b, color, { r = 0.035, on = 0.22, off = 0.14, opacity = 1 } = {}) {
      const len = a.distanceTo(b); if (len < 1e-4) return;
      const dir = b.clone().sub(a).divideScalar(len);
      for (let s = 0; s < len; s += on + off) {
        const p0 = a.clone().addScaledVector(dir, s), p1 = a.clone().addScaledVector(dir, Math.min(len, s + on));
        placeSeg(tubes.get(basic(color, opacity)), p0, p1, r);
      }
    }
  };
}
/** 圓點貼圖（粒子用） */
function dotTexture(fill = '#ffffff', rim = 'rgba(120,130,150,.75)') {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.beginPath(); g.arc(32, 32, 26, 0, TAU); g.fillStyle = fill; g.fill();
  g.lineWidth = 6; g.strokeStyle = rim; g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function glowTexture(rgb = '255,80,60') {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');

/** 記錄「波源過去的位移」：波傳到 x 處的位移 = 波源在 (t − x / V) 時的位移 */
function makeHist() { return { t: [], v: [] }; }
function pushHist(h, t, v, keep) {
  h.t.push(t); h.v.push(v);
  while (h.t.length > 2 && h.t[1] < t - keep) { h.t.shift(); h.v.shift(); }
}
function sampleHist(h, tq) {
  const T = h.t, n = T.length;
  if (!n || tq < T[0]) return 0;
  if (tq >= T[n - 1]) return h.v[n - 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (T[m] <= tq) lo = m; else hi = m; }
  const k = (tq - T[lo]) / Math.max(1e-9, T[hi] - T[lo]);
  return h.v[lo] + (h.v[hi] - h.v[lo]) * k;
}

  pax.wood.color.setHex(0xc9935a); P.traverse(o => { if (o.isMesh && o.material !== pax.wood) o.material.color.setHex(0xa8743f); });
  const holdBall = HOLD.children[1];
  pax.armL.sh.rotation.set(-0.12, 0, 0.08); pax.armL.el.rotation.z = 0.25;         // 左手自然下垂
  const UP1 = 0.34, UP2 = 0.385, _t = V3(), _sp = V3();
  function posePassenger() {
    // 吊環球相對吊桿的水平位移 → 身體跟著同方向傾斜（角度較小，避免誇張或穿模）

    const GRIP = LEN + 0.18;

    const lean = clamp(Math.asin(clamp((tB.x - P.position.x) / (1.55 * PS), -1, 1)), -0.35, 0.35);
    P.rotation.z = -lean;                                         // 正值＝頭往前（+x）
    P.position.y = FLOOR_Y + Math.abs(Math.sin(lean)) * (lean > 0 ? 0.15 : 0.05) * PS;   // 腳尖／腳跟不穿過地板
    pax.torso.rotation.z = -lean * 0.15; pax.legL.hp.rotation.z = pax.legR.hp.rotation.z = 0;
    // 右手兩節 IK：把吊環位置換到軀幹座標，求肩、肘角度
    P.updateMatrixWorld(true);
    const tl = pax.torso.worldToLocal(_t.clone()), sh = pax.armR.sh.position;
    sh.set(0, 0.5, 0.25);
    let dx = tl.x - sh.x, dy = tl.y - sh.y;
    // 擺到最高時伸手不夠長 → 肩膀往上聳一點去搆
    const over = Math.hypot(dx, dy) - (UP1 + UP2 - 0.01);
    if (over > 0) { const k = Math.min(over, 0.14) / Math.hypot(dx, dy); sh.x += dx * k; sh.y += dy * k; dx = tl.x - sh.x; dy = tl.y - sh.y; }
    const D = clamp(Math.hypot(dx, dy), 0.1, UP1 + UP2 - 0.002);
    const base = Math.atan2(dx, -dy);
    const a1 = Math.acos(clamp((UP1 * UP1 + D * D - UP2 * UP2) / (2 * UP1 * D), -1, 1));
    const g = Math.acos(clamp((UP1 * UP1 + UP2 * UP2 - D * D) / (2 * UP1 * UP2), -1, 1));
    pax.armR.sh.rotation.set(0, 0, base + a1); pax.armR.el.rotation.z = -(Math.PI - g);
  }
  const lAng = addLabel('bus', '', 'small org', V3(0, 0, 0));
  addLabel('bus', '前進方向 →', 'small', V3(2.4, 3.25, 0.2));
  const st = { v: 0, a: 0, mode: 'stop', th: 0, w: 0, off: 0, msg: '', msgT: 0 };
  $('buGo').addEventListener('click', () => { if (st.mode === 'stop') { st.mode = 'acc'; st.msg = 'go'; st.msgT = 0; } });
  $('buStop').addEventListener('click', () => { if (st.v > 0.1) { st.mode = 'brake'; st.msg = 'stop'; st.msgT = 0; } });
  const VMAX = 8;
  function update(dt) {
    st.msgT += dt;
    st.a = st.mode === 'acc' ? 7 : st.mode === 'brake' ? -16 : 0;
    st.v = clamp(st.v + st.a * dt, 0, VMAX);
    if (st.mode === 'acc' && st.v >= VMAX) st.mode = 'cruise';
    if (st.mode === 'brake' && st.v <= 0) st.mode = 'stop';
    if (st.mode === 'brake' || st.mode === 'stop') st.a = st.v > 0 ? st.a : 0;
    // 單擺在加速車廂中：θ'' ＝ −(g/L) sinθ − (a/L) cosθ − cθ'（θ>0 表示往前擺）
    const sub = 8, h = dt / sub, L = LEN + 0.1;

    // 有人握住的那個吊環被手臂拉住，擺幅較小（最多約 31°）；另外兩個自由擺動
    straps.forEach(p => { p.rotation.z = p === HOLD ? 0.55 * Math.tanh(st.th / 0.55) : st.th; });
    posePassenger();
    bus.rotation.z = st.a * 0.0025; bus.position.y = 0.02 * Math.sin(wall * 9) * Math.min(1, st.v / 4);
    st.off = (st.off + st.v * dt) % 32;
    const wrap = x => ((x % 32) + 32) % 32 - 15;
    dashes.forEach((d, i) => { d.position.x = wrap(i * 2 - st.off); });
    props.forEach((t, i) => { t.position.x = wrap(i * 4 - st.off); });
    wheels.forEach(w => { w.rotation.y -= st.v * dt / 0.42; });
    const deg = st.th * 180 / Math.PI;
    setLabel(lAng, `${deg >= 0 ? '向前' : '向後'} ${Math.abs(deg).toFixed(0)}°`); lAng.show = Math.abs(deg) > 2;
    lAng.pos.copy(straps[1].localToWorld(V3(0, -LEN - 0.45, 0))); lAng.off.copy(lAng.pos);
    $('buGo').disabled = st.mode !== 'stop'; $('buStop').disabled = st.v <= 0.1 || st.mode === 'brake';
    const tip = $('buTip');
    if (st.msg === 'go' && st.msgT < 6) { tip.hidden = false; tip.className = 'tip cool'; tip.textContent = '🚌 車往前開，把手想留在原地 ➔ 向後傾！（靜者恆靜）'; }
    else if (st.msg === 'stop' && st.msgT < 6) { tip.hidden = false; tip.className = 'tip bad'; tip.textContent = '🛑 車停了，把手想繼續往前 ➔ 向前傾！（動者恆動）'; }
    else tip.hidden = true;
    const state = { stop: '停在站牌', acc: '突然起步加速中', cruise: '等速前進', brake: '緊急煞車中' }[st.mode];
    setHTML('buStat', `公車狀態：<b>${state}</b><br>車速：<b class="b">${(st.v * 3.6 * 4).toFixed(0)} km/h</b>（動畫示意）<br>吊環擺動角度：<b class="o">${deg >= 0 ? '向前' : '向後'} ${Math.abs(deg).toFixed(0)}°</b><br><small>等速前進時，吊環慢慢回到垂直——因為車速不再改變。</small>`);

      : st.mode === 'brake' || (st.msg === 'stop' && st.msgT < 3) ? `<small>緊急煞車・動者恆動</small>車子停下，吊環想<b>繼續往前</b><span class="huge red">吊環向前擺 →</span>`
        : st.mode === 'cruise' ? `<small>等速前進</small>速度不變時，吊環和車子一起前進<span class="huge grn">吊環回到垂直</span>`
          : `<small>公車吊環</small>按「突然起步」，觀察吊環往哪邊擺<span class="huge org">靜者恆靜、動者恆動</span>`);
  }
  return { group, update, st };
})();

/* =========================================================
   Tab 3：抽桌布（質量越大，慣性越大）
   ========================================================= */
const CL = (() => {
  const group = new THREE.Group(); scene.add(group);
  const TY = 1.68;
  const top = shadowed(rbox(3.6, 0.16, 2.2, woodM(0xd2a878), 0.05)); top.position.y = TY - 0.08; group.add(top);
  [[-1.6, -0.9], [1.6, -0.9], [-1.6, 0.9], [1.6, 0.9]].forEach(([x, z]) => { const l = shadowed(rbox(0.14, TY - 0.16, 0.14, woodM(0xb88a5a), 0.03)); l.position.set(x, (TY - 0.16) / 2, z); group.add(l); });
  // 桌布（含垂下的部分）
  const clothTex = (() => { const c = document.createElement('canvas'); c.width = 256; c.height = 128; const g = c.getContext('2d'); g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, 256, 128); g.strokeStyle = '#e57373'; g.lineWidth = 6; g.strokeRect(8, 8, 240, 112); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  const clothM = new THREE.MeshStandardMaterial({ map: clothTex, roughness: 0.9, side: THREE.DoubleSide });
  const cloth = new THREE.Group(); group.add(cloth);
  const cTop = new THREE.Mesh(new THREE.PlaneGeometry(3.3, 1.8), clothM); cTop.rotation.x = -Math.PI / 2; cTop.position.set(0.15, TY + 0.006, 0); cTop.receiveShadow = true; cloth.add(cTop);
  const cHang = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 1.8), clothM); cHang.rotation.set(-Math.PI / 2, -Math.PI / 2, 0); cHang.position.set(1.81, TY - 0.37, 0); cloth.add(cHang);
  const grip = shadowed(sphere(0.12, clay(0xf1c9a5), 16)); grip.scale.set(1.3, 0.8, 1); grip.position.set(1.86, TY - 0.72, 0); cloth.add(grip);
  // 玻璃瓶
  const prof = [V2(0.001, 0), V2(0.2, 0), V2(0.22, 0.03), V2(0.22, 0.55), V2(0.17, 0.68), V2(0.08, 0.78), V2(0.075, 0.92), V2(0.085, 0.95), V2(0.001, 0.95)];
  const glass = new THREE.MeshPhysicalMaterial({ color: 0xeaf6fb, transmission: 0.9, roughness: 0.06, thickness: 0.15, ior: 1.45, transparent: true, opacity: 0.7, side: THREE.DoubleSide, depthWrite: false });
  function bottle(full) {
    const pv = new THREE.Group(); group.add(pv);
    const b = new THREE.Group(); pv.add(b);
    const shell = new THREE.Mesh(new THREE.LatheGeometry(prof, 40), glass); shell.renderOrder = 6; b.add(shell);
    const cap = shadowed(cyl(0.09, 0.09, 0.08, clay(full ? 0x1e6aa8 : 0xb0b4ba), 20)); cap.position.y = 0.98; b.add(cap);
    if (full) { const w = new THREE.Mesh(new THREE.LatheGeometry([V2(0.001, 0.02), V2(0.2, 0.02), V2(0.2, 0.55), V2(0.155, 0.66), V2(0.001, 0.66)], 40), new THREE.MeshPhysicalMaterial({ color: 0x4fa3e0, transparent: true, opacity: 0.82, roughness: 0.2, transmission: 0.2 })); w.renderOrder = 5; b.add(w); }
    const sh = new THREE.Mesh(new THREE.CircleGeometry(0.22, 24), new THREE.MeshBasicMaterial({ color: 0x5d4037, transparent: true, opacity: 0.15, depthWrite: false })); sh.rotation.x = -Math.PI / 2; sh.position.y = 0.003; b.add(sh);
    return { pv, b };
  }
  const heavy = bottle(true), light = bottle(false);
  const lHeavy = addLabel('cloth', '裝滿水 1.2 kg', 'small blu2', V3(0, 0, 0)), lLight = addLabel('cloth', '空瓶 0.2 kg', 'small', V3(0, 0, 0));
  const HX = -0.75, LX = 0.25, R0 = 0.22;
  const st = { t: -1, done: false };
  function place() {
    cloth.position.x = 0; cloth.visible = true;
    heavy.pv.position.set(HX, TY + 0.012, 0); heavy.pv.rotation.set(0, 0, 0); heavy.b.position.set(0, 0, 0);
    light.pv.position.set(LX + R0, TY + 0.012, 0); light.pv.rotation.set(0, 0, 0); light.b.position.set(-R0, 0, 0);

  place();
  $('clPull').addEventListener('click', () => { if (st.t >= 0) place(); st.t = 0; st.done = false; });

onTabChange = t => { if (t !== 'slope') SL.reset(); if (t !== 'bus') { BU.st.mode = 'stop'; BU.st.v = 0; BU.st.th = 0; BU.st.w = 0; BU.st.msg = ''; } if (t !== 'cloth') { CL.st.t = -1; CL.place(); } };

/* =========================================================
   Tab 切換、鏡頭
   ========================================================= */
const TABS = {
  slope: { group: SL.group, cam: () => ({ pos: [2.0, 3.4, 12], target: [2.0, 1.5, 0], fitW: window.innerWidth < window.innerHeight ? 12 : 13 }), update: SL.update },
  bus: { group: BU.group, cam: () => ({ pos: [0.3, 3.4, 9], target: [0.3, 1.7, 0], fitW: window.innerWidth < window.innerHeight ? 6.4 : 7.4 }), update: BU.update },
  cloth: { group: CL.group, cam: () => ({ pos: [0.3, 3.5, 6.2], target: [0.3, 1.9, 0], fitW: window.innerWidth < window.innerHeight ? 4.6 : 5.2 }), update: CL.update }
};
function setTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== t; });
  for (const [k, v] of Object.entries(TABS)) v.group.visible = k === t;
  onTabChange(t);
  renderer.domElement.style.cursor = '';
  goView(TABS[t].cam());
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* file:// */ }
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
function layoutDock() {
  const d = $('dock');
  if (window.MobileView?.isMobile()) { d.style.left = ''; d.style.maxWidth = ''; return; }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  d.style.left = ((left + window.innerWidth) / 2) + 'px';
  d.style.maxWidth = Math.max(300, window.innerWidth - left - 28) + 'px';
}
function viewFor(c) {
  const pos = V3(...c.pos), tgt = V3(...c.target);
  if (!window.innerWidth || !window.innerHeight) return { pos, tgt };
  if (window.MobileView?.isMobile()) {
    const dist = pos.distanceTo(tgt), tanH = Math.tan(Math.min(camera.fov, 50) * Math.PI / 360);
    const need = (c.fitW || 0) * 1.08 / (2 * tanH * camera.aspect);
    if (need > dist) pos.sub(tgt).multiplyScalar(need / dist).add(tgt);
    return { pos, tgt };
  }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  const dist = pos.distanceTo(tgt), tanH = Math.tan(camera.fov * Math.PI / 360);
  if (c.fitW) {
    const avail = Math.max(0.35, (window.innerWidth - left) / window.innerWidth);
    const need = c.fitW / avail / (2 * tanH * camera.aspect);
    if (need > dist * 1.0001) { pos.sub(tgt).multiplyScalar(need / dist).add(tgt); return viewFor({ pos: pos.toArray(), target: tgt.toArray() }); }
  }
  const visH = 2 * dist * tanH, visW = visH * camera.aspect;
  const sx = -(left / 2) / window.innerWidth * visW;
  const sy = (($('dock').getBoundingClientRect().height + 18) / 2) / window.innerHeight * visH;
  pos.x += sx; tgt.x += sx; pos.y += sy; tgt.y += sy;
  return { pos, tgt };
}
let camTw = null;
function goView(c, instant = false) {
  layoutDock();
  const { pos, tgt } = viewFor(c);
  if (instant) { camTw = null; camera.position.copy(pos); controls.target.copy(tgt); controls.update(); return; }
  camTw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, k: 0 };
}
controls.addEventListener('start', () => { camTw = null; });
$('viewBtn').addEventListener('click', () => goView(TABS[tab].cam()));
$('collapse').addEventListener('click', () => { const c = $('panel').classList.toggle('collapsed'); $('collapse').textContent = c ? '展開' : '收合'; layoutDock(); });
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!w || !h) return;
  renderer.setPixelRatio((window.Look ? window.Look.pixelRatio() : Math.min(window.devicePixelRatio || 1, 2)));
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.fov = 40; camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { resize(); goView(TABS[tab].cam(), true); });

const clock = new THREE.Clock();
function frame(dt) {
  wall += dt;
  TABS[tab].update(dt);
  if (camTw) {
    camTw.k = Math.min(1, camTw.k + dt / 1.3);
    const s = smooth(0, 1, camTw.k);
    camera.position.lerpVectors(camTw.p0, camTw.p1, s);
    controls.target.lerpVectors(camTw.t0, camTw.t1, s);
    if (camTw.k >= 1) camTw = null;
  }
  controls.update();
  if (!window.innerWidth || !window.innerHeight) return;
  placeLabels();
  window.MobileView?.offset(camera);
  renderer.render(scene, camera);
}
function animate() { frame(Math.min(clock.getDelta(), 0.05)); requestAnimationFrame(animate); }

window.lab = { frame, setTab, SL, BU, CL, camera, controls, renderer, scene, placeLabels };

resize();
const first = TABS[location.hash.slice(1)] ? location.hash.slice(1) : 'slope';
tab = first;
for (const [k, v] of Object.entries(TABS)) v.group.visible = k === first;
document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === first));
document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== first; });
goView(TABS[first].cam(), true);
animate();
</script>

    document.getElementById('scene').innerHTML = '<div class="fallback">無法載入 Three.js。<br>請確認電腦已連上網路後重新整理。</div>';
  }
}, 6000);
</script>
