<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物的運輸</title>
<style>
  :root {
    --bg: #f5f1e7;
    --ink: #5d4037;
    --ink-soft: #8d7366;
    --card: rgba(255,255,255,.58);
    --accent: #a1674a;
    --ok: #4f7d5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: absolute; inset: 0; }
  #scene canvas { display: block; touch-action: none; }
  .glass {
    background: var(--card); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,.9); box-shadow: 0 18px 44px rgba(93,64,55,.1), 0 2px 6px rgba(93,64,55,.05);
  }
  .panel { position: absolute; top: 18px; left: 18px; width: 318px; max-height: calc(100vh - 36px); overflow-y: auto; z-index: 10; border-radius: 26px; padding: 18px; }
  .panel.collapsed { width: auto; min-width: 240px; }
  .panel.collapsed .body { display: none; }
  .collapse { position: absolute; top: 18px; right: 16px; z-index: 2; cursor: pointer; border: none; font: inherit; font-size: .76rem; font-weight: 600; color: var(--accent); background: rgba(161,103,74,.12); border-radius: 999px; padding: 4px 12px; }
  .back { font-size: .78rem; color: var(--accent); text-decoration: none; }
  .title { font-size: 1.12rem; font-weight: 800; margin-top: 6px; padding-right: 62px; line-height: 1.4; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0 10px; }
  .tab { border: none; cursor: pointer; font: inherit; font-size: .78rem; font-weight: 800; padding: 9px 4px; border-radius: 14px; color: var(--ink); background: rgba(255,255,255,.6); line-height: 1.4; }
  .tab small { display: block; font-weight: 600; opacity: .8; font-size: .68rem; }
  .tab:hover { background: rgba(255,255,255,.95); }
  .tab.on { color: #fff; background: #8d6e63; box-shadow: 0 6px 16px rgba(93,64,55,.25); }
  .sec[hidden] { display: none; }
  .concept { background: rgba(255,255,255,.85); border-radius: 16px; padding: 10px 12px; margin: 2px 0 8px; box-shadow: 0 4px 14px rgba(93,64,55,.07); border-left: 5px solid var(--cc, #8d6e63); }
  .concept .ct { font-size: 1rem; font-weight: 900; color: var(--cc, #8d6e63); }
  .concept .cd { font-size: .82rem; font-weight: 700; margin-top: 2px; line-height: 1.6; }
  .desc { font-size: .78rem; color: var(--ink-soft); line-height: 1.65; margin: 6px 0; }
  .desc b { color: var(--ink); }
  .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: .8rem; font-weight: 800; color: var(--ink-soft); margin-top: 10px; }
  .lab b { font-size: 1.1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  input.big[type=range] { height: 40px; }
  .ticks { display: flex; justify-content: space-between; font-size: .68rem; font-weight: 800; color: var(--ink-soft); margin-top: -4px; }
  select { width: 100%; font: inherit; font-size: .86rem; font-weight: 700; border: 1px solid #e6dccd; border-radius: 12px; padding: 9px 10px; background: rgba(255,255,255,.9); color: var(--ink); margin-top: 4px; }
  .btn {
    width: 100%; border: none; border-radius: 14px; padding: 10px 6px; cursor: pointer; margin-top: 6px;
    font: inherit; font-size: .82rem; font-weight: 700; color: var(--ink); background: rgba(255,255,255,.62);
    transition: background .2s, transform .1s, box-shadow .2s;
  }
  .btn small { display: block; font-weight: 600; font-size: .7rem; opacity: .8; }
  .btn:hover { background: rgba(255,255,255,.95); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.on { color: #fff; background: #a1674a; box-shadow: 0 6px 16px rgba(161,103,74,.28); }
  .btn.primary { color: #fff; background: #5b8a72; box-shadow: 0 6px 16px rgba(79,125,92,.28); font-size: .9rem; padding: 12px 6px; }
  .btn.primary:hover { background: #4f7d65; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { background: rgba(255,255,255,.78); border-radius: 14px; padding: 9px 11px; margin-top: 8px; font-size: .8rem; line-height: 1.75; font-variant-numeric: tabular-nums; }
  .stat b { font-size: .92rem; }
  .stat .r { color: #c62828; } .stat .b { color: #1e6aa8; } .stat .g { color: var(--ok); } .stat .o { color: #d35400; }
  .mapbox { background: rgba(255,255,255,.85); border-radius: 14px; padding: 8px; margin-top: 8px; }
  .mapbox canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  .mapbox p { font-size: .72rem; font-weight: 800; color: var(--ink-soft); margin-bottom: 4px; }

  .dock { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 9; border-radius: 24px; padding: 12px 22px; text-align: center;
          width: max-content; max-width: min(900px, calc(100vw - 380px)); min-width: 300px; }
  .cap { font-size: .9rem; font-weight: 700; line-height: 1.6; }
  .cap small { display: block; font-size: .72rem; color: var(--ink-soft); font-weight: 700; letter-spacing: .06em; }
  .cap b { color: #a1674a; }
  .cap .huge { display: block; font-size: clamp(1.1rem, 2.2vw, 1.8rem); font-weight: 900; line-height: 1.4; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .cap .pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .cap .red { color: #c62828; } .cap .blu { color: #1e6aa8; } .cap .grn { color: var(--ok); } .cap .org { color: #d35400; }
  .cap .chg { font-size: .62em; font-weight: 800; vertical-align: middle; }

  .tag {
    position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%);
    font-size: .74rem; font-weight: 800; padding: 4px 10px; border-radius: 12px; white-space: nowrap; text-align: center; line-height: 1.45;
    background: rgba(255,255,255,.88); color: var(--ink); box-shadow: 0 4px 12px rgba(93,64,55,.1); font-variant-numeric: tabular-nums;
  }
  .tag.red { background: #e53935; color: #fff; }
  .tag.energy { background: #f4a261; color: #fff; font-size: .82rem; }
  .tag.yel { background: #fff3c4; color: #8a6200; border: 1.5px solid #e0b000; }
  .tag.lam { background: #1e6aa8; color: #fff; }
  .tag.depth { background: #d84315; color: #fff; font-size: .82rem; }
  .tag.small { font-size: .64rem; padding: 2px 7px; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-soft); line-height: 1.8; }

  @media (max-width: 768px), (max-width: 1100px) and (orientation: portrait) {
    .dock { top: 8px; bottom: auto; left: 8px; right: 8px; transform: none; max-width: none; min-width: 0; width: auto; padding: 8px 10px; border-radius: 18px; }
    .cap { font-size: .74rem; }
    .cap .huge { font-size: .98rem; }
    .tag { font-size: .62rem; padding: 2px 7px; }
  }
  .tabs.three { grid-template-columns: 1fr 1fr 1fr; }
  .tabs.three .tab { font-size: .72rem; padding: 9px 2px; }
  .objs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  .objs.three { grid-template-columns: repeat(3, 1fr); }
  .objs .btn { padding: 8px 4px; font-size: .78rem; margin-top: 0; }
  .objs .btn.yes { background: #e3f1e6; color: #2e6b3f; } .objs .btn.no { background: #fde5e2; color: #a5311f; }
  .orgcard { background: rgba(255,255,255,.85); border-radius: 16px; padding: 10px 12px; margin-top: 8px; font-size: .8rem; line-height: 1.65; box-shadow: 0 4px 14px rgba(93,64,55,.07); }
  .orgcard:empty { display: none; }
  .orgcard h4 { font-size: .98rem; font-weight: 900; margin-bottom: 2px; }
  .orgcard .pill { display: inline-block; font-size: .72rem; font-weight: 800; color: #fff; background: #7b5ea7; border-radius: 999px; padding: 1px 9px; margin: 2px 4px 2px 0; }
  .orgcard i.sci { font-family: Georgia, serif; }
  .orgcard table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .orgcard td, .orgcard th { padding: 2px 4px; border-bottom: 1px solid #efe6d8; font-size: .74rem; text-align: left; }
  .orgcard tr.same { background: #e3f1e6; } .orgcard tr.diff td { color: #a8998a; }
  .tag.big { font-size: .86rem; }
  .stat table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: .74rem; }
  .stat td, .stat th { padding: 3px 3px; border-bottom: 1px solid #efe6d8; text-align: left; white-space: nowrap; }
  .stat tr.same { background: #e3f1e6; }
  .tip { background: #fff3c4; color: #7a5300; border: 1.5px solid #e0b000; border-radius: 14px; padding: 9px 11px; margin-top: 8px; font-size: .82rem; font-weight: 800; line-height: 1.6; animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .tip[hidden], .mapbox[hidden], .btn[hidden] { display: none; }
  .ticks span:first-child { text-align: left; } .ticks span:last-child { text-align: right; }
  .meter { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: .74rem; font-weight: 800; color: var(--ink-soft); }
  .meter i { flex: 1; height: 16px; border-radius: 999px; background: linear-gradient(90deg, #f7efe6, #8b2e0f); position: relative; }
  .meter i::after { content: ''; position: absolute; top: -4px; width: 6px; height: 24px; border-radius: 3px; background: var(--ink); left: var(--v, 50%); transform: translateX(-50%); transition: left .2s; }
  .cap .eq { display: inline-flex; align-items: center; gap: 6px; font-size: 1.05em; font-weight: 900; }
  .cap .arrs { display: inline-flex; flex-direction: column; line-height: .9; font-size: 1.1em; }
  .cap .arrs span { opacity: .28; transition: opacity .3s, color .3s, transform .3s; }
  .cap .arrs span.on { opacity: 1; color: #c62828; transform: scale(1.35); }
  .cap .brown { color: #8b2e0f; }
  .legend { display: flex; gap: 6px; margin: 8px 0 2px; font-size: .72rem; font-weight: 800; }
  .legend .lg { flex: 1; text-align: center; border-radius: 999px; padding: 3px 0; color: #fff; }
  .legend .f { background: #ff2d2d; } .legend .a { background: #22c55e; } .legend .w { background: #424242; } .legend .n { background: #29b6f6; }
  .tag.vA { background: #16a34a; color: #fff; font-weight: 900; } .tag.vN { background: #29b6f6; color: #fff; font-weight: 900; }
  .formula { font-size: 1.02rem; font-weight: 900; background: #fff1c9; border-radius: 10px; padding: 5px 8px; margin-bottom: 4px; text-align: center; } .bbtn.on { background: #fff1c9; box-shadow: 0 0 0 2px #f0b429 inset; color: #5d4037; }
  .tag.vF { background: #ff2d2d; color: #fff; font-weight: 900; } .tag.vS { background: #29b6f6; color: #fff; font-weight: 900; } .tag.vW { background: #424242; color: #fff; font-weight: 900; } .tag.org { background: #ef6c00; color: #fff; font-weight: 900; }
  .tip.ok { background: #e3f1e6; color: #1f5f32; border-color: #3f9a57; } .tip.bad { background: #fde5e2; color: #a5311f; border-color: #e53935; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .half { background: rgba(255,255,255,.85); border-radius: 14px; padding: 8px 9px; font-size: .76rem; line-height: 1.6; box-shadow: 0 4px 14px rgba(93,64,55,.07); }
  .half h4 { font-size: .86rem; font-weight: 900; margin-bottom: 2px; }
  .half .res { margin-top: 4px; font-weight: 900; font-size: .9rem; border-radius: 10px; padding: 3px 6px; text-align: center; }
  .half .res.pos { background: #e3f1e6; color: #1f5f32; } .half .res.neg { background: #fde5e2; color: #a5311f; } .half .res.zero { background: #efe9df; color: #7a6a5a; }
  .legend .piv { background: #e0b800; } .legend .tq { background: #ff8a1f; }
  .lvbtn.on { background: #fff1c9; box-shadow: 0 0 0 2px #f0b429 inset; color: #5d4037; }
  .stat b.g { color: #2e7d32; } .stat b.r { color: #e53935; }
  /* 毛玻璃：本頁規格 */
  .panel.glass, .dock.glass, .skyBox.glass { background: rgba(255,255,255,0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; color: #5d4037; }
  .scaleNote { position: fixed; right: 14px; bottom: 10px; z-index: 9; font-size: .72rem; font-weight: 700; color: #8d6e63; background: rgba(255,255,255,.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; padding: 4px 10px; }
  .skyBox { position: fixed; right: 16px; top: 16px; z-index: 9; width: 236px; padding: 8px; }
  .skyBox[hidden] { display: none; }
  .skyBox canvas { width: 100%; height: auto; border-radius: 10px; display: block; margin: 5px 0; }
  .skyT { font-size: .76rem; font-weight: 700; line-height: 1.4; }
  .row2.mini .btn { font-size: .7rem; padding: 5px 2px; margin-top: 0; }
  .hint { font-size: .72rem; color: #8d6e63; background: rgba(255,255,255,.55); border-radius: 10px; padding: 5px 8px; margin: 6px 0 8px; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; margin-top: 8px; cursor: pointer; }
  .chk input { width: 17px; height: 17px; accent-color: #8d6e63; }
  .cards { display: grid; gap: 5px; margin-top: 8px; }
  .cards .card { background: rgba(255,255,255,.72); border-radius: 12px; padding: 6px 9px; font-size: .78rem; line-height: 1.55; box-shadow: 0 3px 10px rgba(93,64,55,.06); }
  .terms { margin-top: 8px; background: rgba(255,255,255,.72); border-radius: 12px; padding: 7px 9px; font-size: .76rem; line-height: 1.7; }
  .ph4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; } .ph4 .btn { margin-top: 0; padding: 8px 2px; }
  .tcurve { width: 100%; height: 150px; display: block; margin-top: 8px; border-radius: 10px; }
  .tw { margin-top: 8px; background: rgba(255,255,255,.72); border-radius: 12px; padding: 6px 9px; font-size: .78rem; }
  .tw summary { font-weight: 800; cursor: pointer; }
  .twmap { width: 100%; height: auto; margin-top: 6px; }
  .tip.gold { background: #fff4d6; color: #7a5300; border-color: #f0b429; } .tip.red { background: #fde5e2; color: #a5311f; border-color: #e53935; }
  .ticks { display: flex; justify-content: space-between; }
  .tag.sunL { background: #fff1c2; color: #8a5a00; } .tag.umb { background: #3d3d3d; color: #fff; } .tag.pen { background: #cfcfcf; color: #333; }
  .tag.eclL { background: #ffe0b2; color: #8a4b00; } .tag.wdL { background: #d6e9ff; color: #0b4d9a; } .tag.nodeL { background: #ffd8c9; color: #b23c17; }
  .tag.pullL { background: #ff3b30; color: #fff; } .tag.sunPullL { background: #ffd59e; color: #8a4b00; } .tag.seaL { background: #d8efff; color: #0d5ea8; } .tag.portL { background: #fff; color: #b71c1c; }
  .tag.hiL { background: #1565c0; color: #fff; } .tag.loL { background: #ef6c00; color: #fff; } .tag.bandL { background: #dcedc8; color: #33691e; }
  .tag.nowL { font-size: .86rem; font-weight: 900; } .tag.nowL.hi { background: #1565c0; color: #fff; } .tag.nowL.lo { background: #ef6c00; color: #fff; } .tag.nowL.up { background: #d8efff; color: #0d5ea8; } .tag.nowL.down { background: #ffe9d6; color: #a14a00; }
  .stat b.r { color: #e53935; }
  .legend.pl .w { background: #2ec5e6; } .legend.pl .f { background: #ff9500; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; } .row3 .btn { margin-top: 0; } .btn:disabled { opacity: .4; }
  .tag.pickL { background: #ff3b30; color: #fff; } .tag.tagW { background: #8d6e63; color: #fff; } .tag.foodL { background: #fff1e0; color: #b25400; border: 1.5px solid #ff9500; } .tag.waterL { background: #e0f7fb; color: #0b6f86; border: 1.5px solid #2ec5e6; }
  @media (max-width: 767px) { .skyBox { width: 160px; top: auto; bottom: 74px; right: 8px; } .skyT { font-size: .64rem; } .scaleNote { bottom: auto; top: 64px; right: 8px; font-size: .62rem; } }
  .zbtn.on { background: #fff1c9; box-shadow: 0 0 0 2px #f0b429 inset; }
</style>

<body data-mv-start="closed">

<div id="scene"></div>
<div class="dock glass" id="dock"><div class="cap" id="cap"></div></div>
<div class="scaleNote" id="scaleNote">構造大小經過放大示意；心臟與血液循環請看 heart-anatomy-lab</div>

<aside class="panel glass" id="panel">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g7">‹ 課程總覽</a>
  <div class="title">植物的運輸</div>
  <div class="body">
    <div class="tabs three">
      <button class="tab on" data-tab="vb">🌿 維管束<small>木質部・韌皮部</small></button>
      <button class="tab" data-tab="tr">💧 水往上走<small>蒸散作用</small></button>
      <button class="tab" data-tab="gd">🌳 環剝與年輪<small>養分往下送</small></button>
    </div>
    <div class="legend pl"><span class="lg w">水分</span><span class="lg f">養分</span></div>

    <!-- Tab 1 -->
    <section class="sec" data-tab="vb">
      <div class="row2">
        <button class="btn vbtype on" data-v="dicot" type="button">雙子葉</button>
        <button class="btn vbtype" data-v="mono" type="button">單子葉</button>
      </div>
      <div class="row2">
        <button class="btn vbview on" data-v="cross" type="button">橫切面</button>
        <button class="btn vbview" data-v="long" type="button">縱切面</button>
      </div>
      <div class="lab">🔍 點切面上的構造，或按這裡</div>
      <div class="row3">
        <button class="btn vbpick on" data-v="xylem" type="button">木質部</button>
        <button class="btn vbpick" data-v="phloem" type="button">韌皮部</button>
        <button class="btn vbpick" data-v="cambium" type="button">形成層</button>
      </div>
      <div id="vbYBox">
        <label class="lab" for="vbY">🌳 加粗年數（木本雙子葉）<b><span id="vbYV">0</span> 年</b></label>
        <input class="big" type="range" id="vbY" min="0" max="8" step="1" value="0">
      </div>
      <div class="stat" id="vbStat"></div>
      <div class="cards">
        <div class="card">💧 <b>木質部</b>在內側，運水和礦物質</div>
        <div class="card">🍯 <b>韌皮部</b>在外側，運養分</div>
        <div class="card">🌱 <b>形成層</b>：向外長韌皮部、向內長木質部</div>
        <div class="card">🌾 單子葉維管束散生，缺少形成層，莖不加粗</div>
      </div>
    </section>

    <!-- Tab 2 -->
    <section class="sec" data-tab="tr" hidden>
      <div class="row2">
        <button class="btn trleaf on" data-v="many" type="button">🌿 葉子多</button>
        <button class="btn trleaf" data-v="few" type="button">🌱 葉子少</button>
      </div>
      <label class="chk"><input type="checkbox" id="trLight"> ☀️ 光照</label>
      <label class="chk"><input type="checkbox" id="trWind"> 🌬️ 風</label>
      <label class="chk"><input type="checkbox" id="trStoma"> 🔍 顯示氣孔（下表皮）</label>
      <div id="trWetBox" hidden>
        <div class="row2">
          <button class="btn trwet on" data-v="wet" type="button">水分充足</button>
          <button class="btn trwet" data-v="dry" type="button">水分不足</button>
        </div>
      </div>
      <button class="btn" id="trReset" type="button">↩️ 試管重新開始</button>
      <div class="stat" id="trStat"></div>
      <div class="cards">
        <div class="card">☀️ 水分上升的主要動力是<b>蒸散作用</b></div>

  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  d.style.left = ((left + window.innerWidth) / 2) + 'px';

}
function viewFor(c) {
  const pos = V3(...c.pos), tgt = V3(...c.target);
  if (!window.innerWidth || !window.innerHeight) return { pos, tgt };
  if (window.MobileView?.isMobile()) {
    const dist = pos.distanceTo(tgt), tanH = Math.tan(Math.min(camera.fov, 50) * Math.PI / 360);
    const need = (c.fitW || 0) * 1.08 / (2 * tanH * camera.aspect);

    return { pos, tgt };

  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  const dist = pos.distanceTo(tgt), tanH = Math.tan(camera.fov * Math.PI / 360);
  if (c.fitW) {
    const avail = Math.max(0.35, (window.innerWidth - left) / window.innerWidth);
    const need = c.fitW / avail / (2 * tanH * camera.aspect);

function frame(dt) {
