function Cylinder(parent, x, label, ballMat, cap = 150, R = 0.62, H = 2.8) {

      分子個數 ＝ 莫耳數 × 6×10²³ ＝ <b class="b">${countText(n)} 個</b><br>
      <small>原子量：H＝1、C＝12、O＝16、Na＝23、Ca＝40（以 C-12＝12 為基準的比較值，沒有單位）</small>`);
    setCap(`<small>${S.f}（${S.name}）・分子量 ${M}</small>${f1m(m)} 克 ＝ ${f1m(n)} 莫耳 ＝ ${countText(n)} 個分子<span class="huge">1 莫耳的質量 ＝ 分子量公克</span>`);
  }
  return { group, update, st };
})();

/* =========================================================
   Tab 2：化學反應式配平
   ========================================================= */
const ATOM = {
  H: { c: 0xf4f4f4, r: 0.13 }, O: { c: 0xef5350, r: 0.2 }, C: { c: 0x555a60, r: 0.21 }
};
const atomMat = {};
for (const [e, a] of Object.entries(ATOM)) atomMat[e] = new THREE.MeshPhysicalMaterial({ color: a.c, transparent: true, opacity: 0.88, roughness: 0.18, clearcoat: 1 });
/** 分子模型（示意）：回傳 [元素, x, y, z] */
const SHAPES = {
  H2: [['H', -0.12, 0, 0], ['H', 0.12, 0, 0]],
  O2: [['O', -0.17, 0, 0], ['O', 0.17, 0, 0]],
  H2O: [['O', 0, 0, 0], ['H', -0.2, -0.14, 0], ['H', 0.2, -0.14, 0]],
  CO2: [['O', -0.34, 0, 0], ['C', 0, 0, 0], ['O', 0.34, 0, 0]],
  C6H12O6: (() => { const r = []; for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2, x = Math.cos(a) * 0.36, y = Math.sin(a) * 0.36; r.push(['C', x, y, 0]); } [[0.62, 0.1], [0.3, 0.56], [-0.3, 0.56], [-0.62, 0.1], [-0.42, -0.5], [0.1, -0.66]].forEach(([x, y], i) => r.push(['O', x, y, 0.05])); for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + 0.2; r.push(['H', Math.cos(a) * 0.82, Math.sin(a) * 0.82, -0.05]); } return r; })()
};
const REACTIONS = {
  water: { name: '氫氣燃燒', L: [['H2', 'H₂'], ['O2', 'O₂']], R: [['H2O', 'H₂O']], ans: [2, 1, 2] },
  photo: { name: '光合作用', L: [['CO2', 'CO₂'], ['H2O', 'H₂O']], R: [['C6H12O6', 'C₆H₁₂O₆'], ['O2', 'O₂']], ans: [6, 6, 1, 6] }
};
const SHAPE_ATOMS = k => { const c = {}; SHAPES[k].forEach(([e]) => { c[e] = (c[e] || 0) + 1; }); return c; };
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const BAL = (() => {
  const group = new THREE.Group(); group.userData.key = 'balance'; scene.add(group);
  tableTop(group, 11, 3.6);
  const arrow = shadowed(new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.5, 20), WM(0xa47a4a))); arrow.rotation.z = -Math.PI / 2; arrow.position.set(0.2, 1.2, 0); group.add(arrow);
  const ash = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.9, 12), WM(0xa47a4a))); ash.rotation.z = Math.PI / 2; ash.position.set(-0.4, 1.2, 0); group.add(ash);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('255,226,120'), transparent: true, opacity: 0, depthWrite: false })); glow.scale.set(12, 5, 1); glow.position.set(0, 1.3, -0.5); group.add(glow);
  const mols = new THREE.Group(); group.add(mols);
  const st = { r: 'water', co: [1, 1, 1] };
  let key = '';
  const cntL = addLabel('balance', '', 'small cntL', V3(-3.0, -0.05, 1.5)), cntR = addLabel('balance', '', 'small cntL', V3(3.2, -0.05, 1.5));
  const nameLabs = [];
  function controls_() {
    const R = REACTIONS[st.r], sp = [...R.L, ...R.R];
    $('baEq').innerHTML = sp.map(([k, f], i) => `<span class="cobox"><button class="btn cobtn" data-i="${i}" data-d="1" type="button">＋</button><b>${st.co[i]}</b><button class="btn cobtn" data-i="${i}" data-d="-1" type="button">－</button><span class="ff">${f}</span></span>${i === R.L.length - 1 ? '<span class="arr">→</span>' : i < sp.length - 1 ? '<span class="plus">＋</span>' : ''}`).join('');
    document.querySelectorAll('.cobtn').forEach(b => { ['pointerdown', 'touchstart'].forEach(ev => b.addEventListener(ev, e => e.stopPropagation(), { passive: true })); b.addEventListener('click', () => { const i = +b.dataset.i; st.co[i] = Math.max(1, Math.min(9, st.co[i] + +b.dataset.d)); controls_(); }); });
  }
  document.querySelectorAll('.barx').forEach(b => b.addEventListener('click', () => { st.r = b.dataset.r; st.co = REACTIONS[st.r].ans.map(() => 1); document.querySelectorAll('.barx').forEach(x => x.classList.toggle('on', x === b)); controls_(); }));
  $('baReset').addEventListener('click', () => { st.co = st.co.map(() => 1); controls_(); });
  controls_();
  function build() {
    while (mols.children.length) mols.remove(mols.children[0]);
    nameLabs.forEach(l => { l.show = false; });
    const R = REACTIONS[st.r], sp = [...R.L, ...R.R], nL = R.L.length;
    const slotW = st.r === 'photo' ? 2.2 : 2.6;
    sp.forEach(([k], i) => {
      const left = i < nL, idx = left ? i : i - nL, cnt = left ? nL : R.R.length;
      const cx = left ? -0.9 - (cnt - idx - 0.5) * slotW : 1.3 + (idx + 0.5) * slotW;
      const n = st.co[i], cols = k === 'C6H12O6' ? 1 : n > 4 ? 3 : 2, sc = k === 'C6H12O6' ? 0.95 : 0.85;
      for (let j = 0; j < n; j++) {
        const g = new THREE.Group(), c = j % cols, r = Math.floor(j / cols);
        g.position.set(cx + (c - (cols - 1) / 2) * (k === 'CO2' ? 0.9 : 0.62), 0.45 + r * (k === 'C6H12O6' ? 1.0 : 0.62), (j % 2) * 0.15);
        g.scale.setScalar(sc);
        SHAPES[k].forEach(([e, x, y, z]) => { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(ATOM[e].r, 2), atomMat[e]); m.position.set(x, y, z); m.castShadow = true; g.add(m); });
        mols.add(g);
      }
      if (!nameLabs[i]) nameLabs[i] = addLabel('balance', '', 'small', V3(0, 0, 0));
      setLabel(nameLabs[i], `${st.co[i]} ${sp[i][1]}`); nameLabs[i].show = true; nameLabs[i].pos.set(cx, -0.05, 1.3); nameLabs[i].off.copy(nameLabs[i].pos);
    });
  }
  function update(dt) {
    const k = st.r + st.co.join();
    if (k !== key) { key = k; build(); }
    const R = REACTIONS[st.r], nL = R.L.length, sp = [...R.L, ...R.R];
    const tot = (from, to) => { const c = {}; for (let i = from; i < to; i++) for (const [e, n] of Object.entries(SHAPE_ATOMS(sp[i][0]))) c[e] = (c[e] || 0) + n * st.co[i]; return c; };
    const L = tot(0, nL), Rr = tot(nL, sp.length), els = [...new Set([...Object.keys(L), ...Object.keys(Rr)])].sort((a, b) => 'COH'.indexOf(a) - 'COH'.indexOf(b));
    const bal = els.every(e => (L[e] || 0) === (Rr[e] || 0)), g = st.co.reduce((a, b) => gcd(a, b)), minimal = g === 1;
    const done = bal && minimal;
    const name = { H: '氫 H', O: '氧 O', C: '碳 C' };
    setLabel(cntL, '反應前：' + els.map(e => `${name[e]} <b>${L[e] || 0}</b>`).join('　'));
    setLabel(cntR, '反應後：' + els.map(e => `${name[e]} <b>${Rr[e] || 0}</b>`).join('　'));
    glow.material.opacity = done ? 0.55 + 0.2 * Math.sin(wall * 3) : 0;
    $('baTable').innerHTML = `<table class="cmp"><tr><th>原子</th><th>反應前</th><th>反應後</th><th></th></tr>${els.map(e => `<tr><td>${name[e]}</td><td>${L[e] || 0}</td><td>${Rr[e] || 0}</td><td>${(L[e] || 0) === (Rr[e] || 0) ? '✅' : '❌'}</td></tr>`).join('')}</table>`;
    const tip = $('baTip');
    if (done) { tip.hidden = false; tip.className = 'tip ok'; tip.textContent = '🎉 配平完成！反應前後每一種原子的數目都相等，而且係數是最小整數比。'; }
    else if (bal) { tip.hidden = false; tip.className = 'tip'; tip.textContent = `⚖️ 原子數目已經相等，但係數還可以同除以 ${g} → 要約成最小整數比才算完成。`; }
    else tip.hidden = true;
    setCap(`<small>化學反應式配平・${R.name}</small>${sp.map(([, f], i) => (st.co[i] > 1 ? st.co[i] : '') + f).slice(0, nL).join(' ＋ ')} → ${sp.map(([, f], i) => (st.co[i] > 1 ? st.co[i] : '') + f).slice(nL).join(' ＋ ')}<span class="huge ${done ? 'grn' : ''}">${done ? '配平完成！' : '調整係數，讓左右各原子數目相等'}</span>`);
  }
  return { group, update, st };
})();

/* =========================================================
   Tab 3：化學計量（6CO₂ ＋ 6H₂O → C₆H₁₂O₆ ＋ 6O₂）
   ========================================================= */
const ST = (() => {
  const group = new THREE.Group(); group.userData.key = 'stoich'; scene.add(group);
  tableTop(group, 12, 3.2);
  const SP = [['CO2', 6, 0x9a9fa6], ['H2O', 6, 0x9fd4f5], ['C6H12O6', 1, 0xe8c27a], ['O2', 6, 0xef8a8a]];
  const cyls = SP.map(([k, , c], i) => Cylinder(group, -4.5 + i * 3, SUBS[k].f, new THREE.MeshPhysicalMaterial({ color: c, transparent: true, opacity: 0.85, roughness: 0.15, clearcoat: 1 }), 120, 0.58, 2.6));
  addLabel('stoich', '＋', 'big', V3(-3.0, 1.4, 0)); addLabel('stoich', '→', 'big', V3(0, 1.4, 0)); addLabel('stoich', '＋', 'big', V3(3.0, 1.4, 0));
  const st = { m: 90 };
  $('stM').addEventListener('input', () => { st.m = +$('stM').value; });
  function update(dt) {
    const mg = st.m, n = mg / 180;                          // 葡萄糖莫耳數
    const mol = [6 * n, 6 * n, n, 6 * n], mass = SP.map(([k], i) => mol[i] * MW(k));
    const maxMol = 6 * 360 / 180;                           // 滑桿最大時的莫耳數
    cyls.forEach((c, i) => { c.fill(mol[i] / maxMol, dt); c.setVal(`${f1m(mol[i])} 莫耳｜${f1m(mass[i])} 克`); });
    $('stMV').textContent = f1m(mg);
    setHTML('stStat', `<div class="formula">6CO₂ ＋ 6H₂O → C₆H₁₂O₆ ＋ 6O₂</div>
      葡萄糖：${f1m(mg)} ÷ 180 ＝ <b>${f1m(n)} 莫耳</b>（顯示到小數第一位；計算用精確值）<br>
      係數比 6 : 6 : 1 : 6 ＝ 莫耳數比<br>
      <table class="cmp"><tr><th></th><th>莫耳數</th><th>質量</th></tr>
      <tr><td>CO₂（44）</td><td>${f1m(mol[0])}</td><td><b>${f1m(mol[0])} × 44 ＝ ${f1m(mass[0])} 克</b></td></tr>
      <tr><td>H₂O（18）</td><td>${f1m(mol[1])}</td><td><b>${f1m(mol[1])} × 18 ＝ ${f1m(mass[1])} 克</b></td></tr>
      <tr><td>C₆H₁₂O₆（180）</td><td>${f1m(mol[2])}</td><td>${f1m(mass[2])} 克</td></tr>
      <tr><td>O₂（32）</td><td>${f1m(mol[3])}</td><td>${f1m(mass[3])} 克</td></tr></table>
      <small>反應前 ${f1m(mass[0] + mass[1])} 克 ＝ 反應後 ${f1m(mass[2] + mass[3])} 克（質量守恆）</small>`);
    setCap(`<small>化學計量・目標葡萄糖 ${f1m(mg)} 克 ＝ ${f1m(n)} 莫耳</small>需要 CO₂ ${f1m(mol[0])} 莫耳（${f1m(mass[0])} 克）、H₂O ${f1m(mol[1])} 莫耳（${f1m(mass[1])} 克）<span class="huge">係數比 ＝ 莫耳數比</span>`);
  }
  return { group, update, st };
})();

/* ----- 共用：面板、按鈕、滑桿不讓事件傳到 3D 畫面；拖曳滑桿時鎖住視角 ----- */
['panel', 'dock', 'scaleNote', 'massNote'].forEach(id => { const el = $(id); if (!el) return; ['pointerdown', 'touchstart'].forEach(ev => el.addEventListener(ev, e => e.stopPropagation(), { passive: true })); });
document.querySelectorAll('input[type=range], select').forEach(r => {
  ['pointerdown', 'touchstart'].forEach(ev => r.addEventListener(ev, e => { e.stopPropagation(); controls.enabled = false; }, { passive: true }));
  ['pointerup', 'pointercancel', 'touchend', 'change'].forEach(ev => r.addEventListener(ev, () => { controls.enabled = true; }));
});
document.querySelectorAll('button').forEach(b => ['pointerdown', 'touchstart'].forEach(ev => b.addEventListener(ev, e => e.stopPropagation(), { passive: true })));

/* =========================================================
   Tab 切換、鏡頭
   ========================================================= */
const TABS = {
  mole: { group: MO.group, cam: () => ({ pos: [0, 4.4, 10.5], target: [0, 1.6, 0], fitW: window.innerWidth < window.innerHeight ? 9 : 10.5 }), update: MO.update },
  balance: { group: BAL.group, cam: () => ({ pos: [0.3, 4.2, 9.5], target: [0.3, 1.0, 0], fitW: window.innerWidth < window.innerHeight ? 10 : 11.5 }), update: BAL.update },
  stoich: { group: ST.group, cam: () => ({ pos: [0, 4.4, 11.5], target: [0, 1.5, 0], fitW: window.innerWidth < window.innerHeight ? 11 : 12.5 }), update: ST.update }
};
function setTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== t; });
  for (const [k, v] of Object.entries(TABS)) v.group.visible = k === t;
  onTabChange(t);
  renderer.domElement.style.cursor = '';
  goView(TABS[t].cam());
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* file:// */ }
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
function layoutDock() {
  const d = $('dock');
  if (window.MobileView?.isMobile()) { d.style.left = ''; d.style.maxWidth = ''; return; }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  d.style.left = ((left + window.innerWidth) / 2) + 'px';
  d.style.maxWidth = Math.max(300, window.innerWidth - left - 28) + 'px';
}
function viewFor(c) {
  const pos = V3(...c.pos), tgt = V3(...c.target);
  if (!window.innerWidth || !window.innerHeight) return { pos, tgt };
  if (window.MobileView?.isMobile()) {
    const dist = pos.distanceTo(tgt), tanH = Math.tan(Math.min(camera.fov, 50) * Math.PI / 360);
    const need = (c.fitW || 0) * 1.08 / (2 * tanH * camera.aspect);
    if (need > dist) pos.sub(tgt).multiplyScalar(need / dist).add(tgt);
    return { pos, tgt };
  }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  const dist = pos.distanceTo(tgt), tanH = Math.tan(camera.fov * Math.PI / 360);
  if (c.fitW) {
    const avail = Math.max(0.35, (window.innerWidth - left) / window.innerWidth);
    const need = c.fitW / avail / (2 * tanH * camera.aspect);
    if (need > dist * 1.0001) { pos.sub(tgt).multiplyScalar(need / dist).add(tgt); return viewFor({ pos: pos.toArray(), target: tgt.toArray() }); }
  }
  const visH = 2 * dist * tanH, visW = visH * camera.aspect;
  const sx = -(left / 2) / window.innerWidth * visW;
  const sy = (($('dock').getBoundingClientRect().height + 18) / 2) / window.innerHeight * visH;
  pos.x += sx; tgt.x += sx; pos.y += sy; tgt.y += sy;
  return { pos, tgt };
}
let camTw = null;
function goView(c, instant = false) {
  layoutDock();
  const { pos, tgt } = viewFor(c);
  if (instant) { camTw = null; camera.position.copy(pos); controls.target.copy(tgt); controls.update(); return; }
  camTw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, k: 0 };
}
controls.addEventListener('start', () => { camTw = null; });
$('viewBtn').addEventListener('click', () => goView(TABS[tab].cam()));
$('collapse').addEventListener('click', () => { const c = $('panel').classList.toggle('collapsed'); $('collapse').textContent = c ? '展開' : '收合'; layoutDock(); });
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!w || !h) return;
  renderer.setPixelRatio((window.Look ? window.Look.pixelRatio() : Math.min(window.devicePixelRatio || 1, 2)));
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.fov = 40; camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { resize(); goView(TABS[tab].cam(), true); });

const clock = new THREE.Clock();
function frame(dt) {
  wall += dt;
  TABS[tab].update(dt);
  if (camTw) {
    camTw.k = Math.min(1, camTw.k + dt / 1.3);
    const s = smooth(0, 1, camTw.k);
    camera.position.lerpVectors(camTw.p0, camTw.p1, s);
    controls.target.lerpVectors(camTw.t0, camTw.t1, s);
    if (camTw.k >= 1) camTw = null;
  }
  controls.update();
  if (!window.innerWidth || !window.innerHeight) return;
  placeLabels();
  window.MobileView?.offset(camera);
  renderer.render(scene, camera);
}
function animate() { frame(Math.min(clock.getDelta(), 0.05)); requestAnimationFrame(animate); }

window.lab = { frame, setTab, MO, BAL, ST, camera, controls, renderer, scene, placeLabels };

resize();
const first = TABS[location.hash.slice(1)] ? location.hash.slice(1) : 'mole';
tab = first;
for (const [k, v] of Object.entries(TABS)) v.group.visible = k === first;
document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === first));
document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== first; });
goView(TABS[first].cam(), true);
animate();
</script>

<script>
setTimeout(() => {
  if (!window.__labReady) {
    document.getElementById('scene').innerHTML = '<div class="fallback">無法載入 Three.js。<br>請確認電腦已連上網路後重新整理。</div>';
  }
}, 6000);
</script>
<script src="goals.js" defer></script>
</body>
