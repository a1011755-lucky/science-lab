<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>天文實驗室：月相・周日運動・四季</title>
<style>
  /* 外殼頁：上方一排分頁，下方把原本的月相、周日運動、四季三頁原封不動放進來（配色沿用原版的深色面板） */
  :root {
    --bg: #060a18; --panel: rgba(11,18,33,.96); --line: rgba(130,170,230,.26);
    --ink: #e6edf8; --muted: #93a7c4; --accent: #6fb6ff; --bar-h: 52px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  #bar {
    position: fixed; top: 0; left: 0; right: 0; height: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); z-index: 10;
    padding: env(safe-area-inset-top, 0px) calc(10px + env(safe-area-inset-right, 0px)) 0 calc(10px + env(safe-area-inset-left, 0px));
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  #home { flex: none; color: var(--muted); text-decoration: none; font-size: .86rem; font-weight: 700; padding: 10px 8px; border-radius: 10px; white-space: nowrap; }
  #home:hover { color: var(--ink); background: rgba(120,170,240,.14); }
  #tabs { flex: 1; display: flex; justify-content: center; gap: 8px; min-width: 0; }
  #tabs button {
    flex: 0 1 auto; min-height: 40px; min-width: 44px; padding: 6px 18px; cursor: pointer; white-space: nowrap;
    font: inherit; font-size: .95rem; font-weight: 800; color: var(--muted);
    background: rgba(120,170,240,.1); border: 1px solid var(--line); border-radius: 999px;
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .12s ease;
  }
  #tabs button:hover { color: var(--ink); background: rgba(120,170,240,.2); }
  #tabs button:active { transform: scale(.96); }
  #tabs button[aria-selected="true"] { color: #fff; background: #2f6fb8; border-color: #6fb6ff; box-shadow: 0 4px 14px rgba(47,111,184,.45); }
  #tabs button:focus-visible, #home:focus-visible { outline: 2px solid #6fb6ff; outline-offset: 2px; }
  #spacer { flex: none; width: 84px; }                 /* 讓分頁在畫面正中間（和左邊的連結等寬） */
  #stage { position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  #stage iframe[hidden] { display: none; }
  @media (max-width: 640px) {
    :root { --bar-h: 48px; }
    #home { font-size: .78rem; padding: 8px 4px; }
    #tabs { gap: 5px; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
    #tabs::-webkit-scrollbar { display: none; }
    #tabs button { padding: 6px 11px; font-size: .82rem; }
    #spacer { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #tabs button { transition: none; } }
</style>
</head>
<body>

<header id="bar">
  <a id="home" href="index.html#g9">‹ 課程總覽</a>
  <nav id="tabs" role="tablist" aria-label="切換單元">
    <button role="tab" type="button" id="tab-moon" data-tab="moon" aria-controls="frame-moon" aria-selected="true">🌙 月相</button>
    <button role="tab" type="button" id="tab-daily" data-tab="daily" aria-controls="frame-daily" aria-selected="false">☀️ 周日運動</button>
    <button role="tab" type="button" id="tab-season" data-tab="season" aria-controls="frame-season" aria-selected="false">🌏 四季與晝夜</button>
  </nav>
  <span id="spacer" aria-hidden="true"></span>
</header>

<main id="stage"></main>

<script>
(function () {
  // 每個分頁對應一個原本的頁面；第一次點到才載入，之後切換只是顯示／隱藏，各頁的操作狀態都會留著
  var PAGES = {
    moon: { src: 'moon-phases.html', title: '月相變化' },
    daily: { src: 'daily-motion.html', title: '周日運動' },
    season: { src: 'season-lab.html', title: '四季與晝夜' }
  };
  var stage = document.getElementById('stage'), frames = {}, current = null;

  function makeFrame(key) {
    var f = document.createElement('iframe');
    f.id = 'frame-' + key; f.title = PAGES[key].title; f.setAttribute('role', 'tabpanel'); f.setAttribute('aria-labelledby', 'tab-' + key);
    f.addEventListener('load', function () {
      try {
        // 分頁裡的「課程總覽」等連結要換掉整個視窗，而不是只在分頁框裡跳轉
        f.contentDocument.addEventListener('click', function (e) {
          var a = e.target.closest && e.target.closest('a[href]');
          if (!a) return;
          var href = a.getAttribute('href');
          if (!href || href.charAt(0) === '#' || a.target === '_blank') return;
          e.preventDefault(); window.top.location.href = a.href;
        }, true);
      } catch (err) { /* 讀不到內容就維持預設行為 */ }
    });
    f.src = PAGES[key].src;
    stage.appendChild(f); frames[key] = f; return f;
  }

  function show(key, updateHash) {
    if (!PAGES[key]) key = 'moon';
    if (key === current) return;
    current = key;
    var f = frames[key] || makeFrame(key);
    Object.keys(frames).forEach(function (k) { frames[k].hidden = k !== key; });
    document.querySelectorAll('#tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === key)); });
    document.title = PAGES[key].title + '｜天文實驗室';
    if (updateHash) { try { history.replaceState(null, '', '#' + key); } catch (e) { /* file:// */ } }
    // 剛顯示出來的分頁：通知它重新計算畫面大小
    setTimeout(function () { try { f.contentWindow.dispatchEvent(new Event('resize')); } catch (e) { /* 尚未載入 */ } }, 60);
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (b) show(b.dataset.tab, true);
  });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1), false); });
  show(location.hash.slice(1) || 'moon', false);
})();
</script>
</body>
</html>
