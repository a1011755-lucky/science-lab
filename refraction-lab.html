<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>光的折射與視深實驗室</title>
<style>
  :root {
    --bg: #f5f1e7;
    --ink: #5d4037;
    --ink-soft: #8d7366;
    --card: rgba(255,255,255,.58);
    --accent: #a1674a;
    --ok: #4f7d5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: absolute; inset: 0; }
  #scene canvas { display: block; touch-action: none; }
  .glass {
    background: var(--card); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,.9); box-shadow: 0 18px 44px rgba(93,64,55,.1), 0 2px 6px rgba(93,64,55,.05);
  }
  .panel { position: absolute; top: 18px; left: 18px; width: 318px; max-height: calc(100vh - 36px); overflow-y: auto; z-index: 10; border-radius: 26px; padding: 18px; }
  .panel.collapsed { width: auto; min-width: 240px; }
  .panel.collapsed .body { display: none; }
  .collapse { position: absolute; top: 18px; right: 16px; z-index: 2; cursor: pointer; border: none; font: inherit; font-size: .76rem; font-weight: 600; color: var(--accent); background: rgba(161,103,74,.12); border-radius: 999px; padding: 4px 12px; }
  .back { font-size: .78rem; color: var(--accent); text-decoration: none; }
  .title { font-size: 1.12rem; font-weight: 800; margin-top: 6px; padding-right: 62px; line-height: 1.4; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0 10px; }
  .tab { border: none; cursor: pointer; font: inherit; font-size: .78rem; font-weight: 800; padding: 9px 4px; border-radius: 14px; color: var(--ink); background: rgba(255,255,255,.6); line-height: 1.4; }
  .tab small { display: block; font-weight: 600; opacity: .8; font-size: .68rem; }
  .tab:hover { background: rgba(255,255,255,.95); }
  .tab.on { color: #fff; background: #8d6e63; box-shadow: 0 6px 16px rgba(93,64,55,.25); }

  .concept { background: rgba(255,255,255,.85); border-radius: 16px; padding: 10px 12px; margin: 2px 0 8px; box-shadow: 0 4px 14px rgba(93,64,55,.07); border-left: 5px solid var(--cc, #8d6e63); }
  .concept .ct { font-size: 1rem; font-weight: 900; color: var(--cc, #8d6e63); }
  .concept .cd { font-size: .84rem; font-weight: 700; margin-top: 2px; line-height: 1.6; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { background: rgba(255,255,255,.78); border-radius: 14px; padding: 9px 11px; margin-top: 8px; font-size: .8rem; line-height: 1.75; font-variant-numeric: tabular-nums; }
  .stat b { font-size: .92rem; }
  .stat .r { color: #c62828; } .stat .y { color: #b7860b; } .stat .b { color: #1e6aa8; } .stat .g { color: var(--ok); }
  .legend { display: grid; gap: 4px; margin-top: 8px; font-size: .76rem; font-weight: 700; color: var(--ink-soft); }

  .legend i.dash { border-top-style: dashed; }
  .note { background: rgba(255,248,230,.85); border: 1.5px solid #ead7a8; color: #6d4c2f; font-weight: 600; border-radius: 14px; padding: 8px 11px; margin-top: 10px; font-size: .76rem; line-height: 1.6; }

  .dock { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 9; border-radius: 24px; padding: 12px 22px; text-align: center;
          width: max-content; max-width: min(860px, calc(100vw - 380px)); min-width: 300px; }
  .cap { font-size: .92rem; font-weight: 700; line-height: 1.6; }
  .cap small { display: block; font-size: .72rem; color: var(--ink-soft); font-weight: 700; letter-spacing: .08em; }
  .cap b { color: #a1674a; }
  .cap .huge { display: block; font-size: clamp(1.1rem, 2.1vw, 1.7rem); font-weight: 900; line-height: 1.4; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .cap .red { color: #c62828; } .cap .yel { color: #b7860b; } .cap .grn { color: var(--ok); }

  .tag {
    position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%);
    font-size: .74rem; font-weight: 800; padding: 4px 10px; border-radius: 12px; white-space: nowrap; text-align: center; line-height: 1.45;
    background: rgba(255,255,255,.88); color: var(--ink); box-shadow: 0 4px 12px rgba(93,64,55,.1); font-variant-numeric: tabular-nums;
  }
  .tag.real { background: #c62828; color: #fff; }
  .tag.ghost { background: rgba(255,248,214,.95); color: #8a6200; border: 1.5px dashed #d4a514; }
  .tag.eye { background: #5d4037; color: #fff; }
  .tag.ang { background: rgba(255,255,255,.92); }
  .tag.tir { background: #c62828; color: #fff; }

  @media (max-width: 768px), (max-width: 1100px) and (orientation: portrait) {
    .dock { top: 8px; bottom: auto; left: 8px; right: 8px; transform: none; max-width: none; min-width: 0; width: auto; padding: 8px 10px; border-radius: 18px; }
    .cap { font-size: .76rem; }

<aside class="panel glass" id="panel">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g8">‹ 課程總覽</a>

  <div class="body">
    <div class="tabs">
      <button class="tab on" data-tab="vis">👁️ 視覺錯覺與視深<small>硬幣與飛鳥</small></button>
      <button class="tab" data-tab="opt">🔴 光學玻璃折射盤<small>法線與折射角</small></button>
    </div>

    <!-- Tab 1 -->
    <section class="sec" data-tab="vis">
      <div class="concept" style="--cc:#a1674a"><div class="ct">大腦以為光走直線</div><div class="cd">光在水面<b>折射</b>轉彎，但大腦把進入眼睛的光線<b>往回直直延伸</b>，在延伸線交會處「看見」虛像。</div></div>
      <label class="lab">觀察情境</label>
      <div class="row2">
        <button class="btn on" data-scen="coin">🪙 從空氣看<small>水底的硬幣</small></button>
        <button class="btn" data-scen="bird">🐦 從水底看<small>空中的飛鳥</small></button>
      </div>
      <label class="lab" for="eyeAng">👁 觀察角度（離開鉛直線）<b><span id="eyeAngV">30</span>°</b></label>
      <input type="range" id="eyeAng" min="0" max="60" step="1" value="30">
      <div class="legend">
        <span><i style="border-color:#e53935"></i>真實光線（物體 → 水面折射 → 眼睛）</span>
        <span><i class="dash" style="border-color:#e0b000"></i>大腦延伸線（以為光走直線）</span>
      </div>
      <div class="stat" id="visStat"></div>
      <p class="desc">斜著看越多，折射越明顯，虛像偏移也越大。</p>
    </section>

    <!-- Tab 2 -->
    <section class="sec" data-tab="opt" hidden>
      <div class="concept" style="--cc:#c62828"><div class="ct">司乃耳定律 n₁ sinθ₁ ＝ n₂ sinθ₂</div><div class="cd">進入玻璃（光速變慢）→ <b>偏向法線</b><br>回到空氣（光速變快）→ <b>偏離法線</b></div></div>
      <label class="lab" for="glassSel">更換玻璃</label>
      <select id="glassSel">
        <option value="rect">▭ 長方體玻璃磚</option>
        <option value="semi">◓ 半圓形玻璃磚</option>
        <option value="prism">△ 三稜鏡</option>
      </select>
      <label class="lab" for="incAng">入射角 θ₁<b><span id="incAngV">30</span>°</b></label>
      <input type="range" id="incAng" min="0" max="80" step="1" value="30">
      <div class="stat" id="optStat"></div>

    <button class="btn" id="viewBtn">🔭 回到預設視角</button>

<script type="module">
import * as THREE from 'three';
import { enhanceLiquid, patchLiquid } from './liquid.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

window.__labReady = true;
const $ = id => document.getElementById(id);
const V3 = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const V2 = (x, y) => new THREE.Vector2(x, y);
const clamp = THREE.MathUtils.clamp;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = (dt, k) => 1 - Math.exp(-dt * k);
const DEG = Math.PI / 180;
const f1 = x => x.toFixed(1);

/* =========================================================
   溫暖無印風場景：米白背景、木紋桌、柔和光影（不使用 Bloom）
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth || 1, window.innerHeight || 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
$('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f1e7);
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0xf6efe2);
const envLight = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
envLight.position.set(3, 5, 4); envLight.scale.setScalar(2.6); envScene.add(envLight);
scene.environment = pmrem.fromScene(envScene, 0.04).texture;
scene.add(new THREE.AmbientLight(0xfff6ea, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.7);
sun.position.set(-7, 16, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -10, near: 1, far: 50 });
sun.shadow.radius = 7; sun.shadow.bias = -0.0005;
scene.add(sun);
const camera = new THREE.PerspectiveCamera(40, (window.innerWidth || 1) / (window.innerHeight || 1), 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 3; controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.49;

function woodTexture(c1 = '#e2c39b', c2 = '#d6b285') {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, c1); grd.addColorStop(1, c2);
  g.fillStyle = grd; g.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 90; i++) {
    const y = Math.random() * 512;
    g.strokeStyle = `rgba(${140 + Math.random() * 40 | 0},${92 + Math.random() * 30 | 0},${52 + Math.random() * 20 | 0},${0.05 + Math.random() * 0.12})`;
    g.lineWidth = 0.8 + Math.random() * 3;
    g.beginPath();
    for (let x = 0; x <= 1024; x += 16) { const yy = y + Math.sin(x * 0.005 + i) * 7 + Math.sin(x * 0.021 + i * 3) * 2; if (x) g.lineTo(x, yy); else g.moveTo(x, yy); }
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const table = new THREE.Mesh(new RoundedBoxGeometry(32, 0.6, 18, 5, 0.28),
  new THREE.MeshPhysicalMaterial({ map: woodTexture(), roughness: 0.75, clearcoat: 0.2, clearcoatRoughness: 0.5 }));
table.position.set(0, -0.3, 1); table.receiveShadow = true; scene.add(table);

const clay = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.6, metalness: 0, clearcoat: 0.3, clearcoatRoughness: 0.45, ...o });
const metal = (color = 0xc9ccd2, o = {}) => clay(color, { metalness: 0.75, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.15, ...o });
const shadowed = m => { m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; };

/* ----- 光線繪製工具：用細圓管畫光線（WebGL 的線條在多數電腦上只能 1 像素粗，教室投影看不清楚） ----- */
const UNIT_CYL = new THREE.CylinderGeometry(1, 1, 1, 10, 1);
const CONE = new THREE.ConeGeometry(1, 1, 14);
const YUP = V3(0, 1, 0);
const matCache = {};
function basic(color, opacity = 1) {
  const k = color + ':' + opacity;
  return matCache[k] || (matCache[k] = new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: opacity >= 1, toneMapped: false }));
}
function makePool(group, geo) {
  const items = []; let used = 0;
  return {
    begin() { used = 0; },
    get(mat) { let m = items[used]; if (!m) { m = new THREE.Mesh(geo, mat); m.renderOrder = 2; group.add(m); items.push(m); } m.material = mat; m.visible = true; used++; return m; },
    end() { for (let i = used; i < items.length; i++) items[i].visible = false; }
  };
}
const tmpD = V3(0, 0, 0);
function placeSeg(m, a, b, r) {
  tmpD.copy(b).sub(a); const len = tmpD.length();
  m.position.copy(a).add(b).multiplyScalar(0.5);
  if (len > 1e-6) m.quaternion.setFromUnitVectors(YUP, tmpD.divideScalar(len));
  m.scale.set(r, Math.max(len, 1e-4), r);
}
function Drawer(group) {
  const tubes = makePool(group, UNIT_CYL), cones = makePool(group, CONE);
  return {
    begin() { tubes.begin(); cones.begin(); },
    end() { tubes.end(); cones.end(); },
    ray(a, b, color, { r = 0.04, glow = true, arrow = true } = {}) {      // 實線光線（含柔和外暈與方向箭頭）
      placeSeg(tubes.get(basic(color)), a, b, r);
      if (glow) placeSeg(tubes.get(basic(color, 0.2)), a, b, r * 2.4);
      const len = a.distanceTo(b);
      if (arrow && len > 0.9) {
        const c = cones.get(basic(color)); const dir = b.clone().sub(a).normalize();
        c.position.copy(a).lerp(b, 0.5); c.quaternion.setFromUnitVectors(YUP, dir); c.scale.set(r * 3.2, r * 7, r * 3.2);
      }
    },
    dash(a, b, color, { r = 0.03, on = 0.24, off = 0.16, opacity = 1 } = {}) {   // 虛線
      const len = a.distanceTo(b); if (len < 1e-4) return;
      const dir = b.clone().sub(a).divideScalar(len);
      for (let s = 0; s < len; s += on + off) {
        const p0 = a.clone().addScaledVector(dir, s), p1 = a.clone().addScaledVector(dir, Math.min(len, s + on));
        placeSeg(tubes.get(basic(color, opacity)), p0, p1, r);
      }
    }
  };
}

/* ----- 浮動標籤 ----- */
const labels = [];
const tmpV = V3(0, 0, 0), tmpW = V3(0, 0, 0);
function addLabel(tabKey, html, cls, off, follow = null) {
  const el = document.createElement('div'); el.className = 'tag ' + (cls || ''); el.innerHTML = html; document.body.appendChild(el);
  const L = { tab: tabKey, el, html, cls: cls || '', off: off.clone(), pos: off.clone(), follow, show: true }; labels.push(L); return L;
}
function setLabel(L, html, cls) {
  if (L.html !== html) { L.html = html; L.el.innerHTML = html; }
  if (cls !== undefined && L.cls !== cls) { L.cls = cls; L.el.className = 'tag ' + cls; }
}
function placeLabels() {
  const w = window.innerWidth, h = window.innerHeight;
  for (const L of labels) {
    if (L.tab !== tab || !L.show) { L.el.style.display = 'none'; continue; }
    if (L.follow) L.pos.copy(L.follow.getWorldPosition(tmpW)).add(L.off);
    tmpV.copy(L.pos).project(camera);
    if (tmpV.z > 1) { L.el.style.display = 'none'; continue; }
    L.el.style.display = '';
    L.el.style.left = ((tmpV.x + 1) / 2 * w) + 'px';
    L.el.style.top = ((1 - tmpV.y) / 2 * h) + 'px';
  }
}
let tab = 'vis', wall = 0;
const setCap = html => { if ($('cap').innerHTML !== html) $('cap').innerHTML = html; };
const setHTML = (id, html) => { if ($(id).innerHTML !== html) $(id).innerHTML = html; };

/* =========================================================
   Tab 1：視覺錯覺與視深（硬幣與飛鳥）
   光線都在水缸正中央的鉛直面（z = 0）上；1 格 ＝ 10 公分
   ========================================================= */
const N_W = 1.33;                                       // 水的折射率
const TW = 12, TH = 5, TD = 3.6, WS = 2.5;              // 水缸寬、高、深；水面高度
const VIS = { group: new THREE.Group(), scen: 'coin', ang: 30, angShow: 30, swap: 1 };
scene.add(VIS.group);
const COIN_P = V2(-2, 0.11), BIRD_P = V2(-2, 6.4);
{
  const g = VIS.group;
  // 木製底座
  const base = shadowed(new THREE.Mesh(new RoundedBoxGeometry(TW + 0.8, 0.3, TD + 0.8, 4, 0.12), clay(0xc9a77c)));
  base.position.set(0, -0.1, 0); g.add(base);
  // 玻璃缸
  const tankGeo = new THREE.BoxGeometry(TW, TH, TD);
  const tank = new THREE.Mesh(tankGeo, new THREE.MeshPhysicalMaterial({ color: 0xf4fbff, roughness: 0.05, clearcoat: 1, transparent: true, opacity: 0.1, depthWrite: false, side: THREE.DoubleSide }));
  tank.position.y = TH / 2 + 0.05; tank.renderOrder = 5; g.add(tank);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(tankGeo), new THREE.LineBasicMaterial({ color: 0xb9c8cf, transparent: true, opacity: 0.9 }));
  edges.position.copy(tank.position); g.add(edges);
  // 水
  const water = new THREE.Mesh(new THREE.BoxGeometry(TW - 0.06, WS, TD - 0.06), new THREE.MeshPhysicalMaterial({ color: 0x7dbfd6, roughness: 0.1, transparent: true, opacity: 0.34, depthWrite: false }));
  water.position.y = WS / 2 + 0.05; water.renderOrder = 4; g.add(water);
enhanceLiquid(water);
  const surf = new THREE.Mesh(new THREE.PlaneGeometry(TW - 0.06, TD - 0.06).rotateX(-Math.PI / 2), new THREE.MeshPhysicalMaterial({ color: 0xbfe6f2, roughness: 0.05, clearcoat: 1, transparent: true, opacity: 0.35, depthWrite: false, side: THREE.DoubleSide }));
  surf.position.y = WS + 0.05; surf.renderOrder = 4; g.add(surf);
  // 缸底的細沙
  const sand = new THREE.Mesh(new THREE.BoxGeometry(TW - 0.08, 0.06, TD - 0.08), clay(0xe9dcc0, { roughness: 0.95, clearcoat: 0 }));
  sand.position.y = 0.06; sand.receiveShadow = true; g.add(sand);
}
VIS.group.position.y = 0;
const OY = 0.05;                                         // 水缸內的高度基準
const P3 = (p, z = 0) => V3(p.x, p.y + OY, z);           // 2D 光路座標 → 3D

// 金幣與虛像金幣
function makeCoin(ghost) {
  const m = ghost
    ? new THREE.MeshStandardMaterial({ color: 0xf2c94c, emissive: 0xc99a10, emissiveIntensity: 0.5, transparent: true, opacity: 0.6, depthWrite: false, roughness: 0.4 })

$('glassSel').addEventListener('change', () => setKind($('glassSel').value));
$('incAng').addEventListener('input', () => { OPT.ang = +$('incAng').value; $('incAngV').textContent = OPT.ang; });

const CRIT = Math.asin(1 / N_G) / DEG;
function updateOpt(dt) {
  OPT.angShow += (OPT.ang - OPT.angShow) * ease(dt, 8);
  OPT.pop = Math.min(1, OPT.pop + dt / 0.45);
  const s = 0.86 + 0.14 * smooth(0, 1, OPT.pop);
  GLASS[OPT.kind].scale.set(s, 1, s);
  const sh = SH[OPT.kind], prism = OPT.kind === 'prism';
  const { pivot, nIn, sign } = pivotAndNormal(OPT.kind);
  const dT = rot2(nIn, sign * OPT.angShow * DEG).normalize();
  const tipT = pivot.clone().addScaledVector(dT, -3.2);
  // 換玻璃時雷射筆平滑移動
  if (!OPT.tip) { OPT.tip = tipT.clone(); OPT.dir = dT.clone(); }
  const k = ease(dt, 9);
  OPT.tip.lerp(tipT, k); OPT.dir.lerp(dT, k).normalize();
  const tip = OPT.tip, dir = OPT.dir;
  laser.position.copy(W3(tip));
  laser.rotation.set(0, -Math.atan2(dir.y, dir.x), 0);
  laserBody.color.setHex(prism ? 0xf3ece0 : 0xd84a3f);
  setLabel(lbLaser, prism ? '🔦 白光光源' : '🔴 紅色雷射筆'); lbLaser.pos.copy(W3(tip.clone().addScaledVector(dir, -1.3), 0.9));
  // 光路
  optDraw.begin();
  let main;
  if (prism) {
    const traces = RAINBOW.map(([c, n]) => ({ c, tr: trace(sh, tip, dir, n) }));
    const first = traces[0].tr.segs[0];
    optDraw.ray(W3(first.a), W3(first.b), 0xfffaf0, { r: 0.05 });           // 入射的白光
    for (const { c, tr } of traces) tr.segs.slice(1).forEach(sg => optDraw.ray(W3(sg.a), W3(sg.b), c, { r: 0.03, arrow: false }));
    main = traces[3].tr;                                                        // 法線、角度用綠光那條
    OPT.spread = traces;
  } else {
    main = trace(sh, tip, dir, N_G);
    main.segs.forEach(sg => optDraw.ray(W3(sg.a), W3(sg.b), 0xff2d2d, { r: sg.inside ? 0.045 : 0.04 }));
    // 半圓形玻璃磚：平直面上的微弱部分反射（越接近臨界角越亮，超過就變成全反射）
    if (OPT.kind === 'semi') {
      const hf = main.hits.find(h => h.flat);
      if (hf && !hf.tir) {
        const cosT = Math.cos(hf.thT * DEG), cosI = Math.cos(hf.thI * DEG);
        const rs = ((hf.n1 * cosI - hf.n2 * cosT) / (hf.n1 * cosI + hf.n2 * cosT)) ** 2, rp = ((hf.n1 * cosT - hf.n2 * cosI) / (hf.n1 * cosT + hf.n2 * cosI)) ** 2;
        const R = (rs + rp) / 2;
        const rd = hf.dIn.clone().addScaledVector(hf.Nf, 2 * Math.cos(hf.thI * DEG)).normalize();
        const tr = trace(sh, hf.p, rd, N_G, true);
        const op = Math.round(clamp(0.15 + R * 2.5, 0.15, 0.85) * 20) / 20;   // 部分反射光的亮度 ∝ 反射率
        tr.segs.forEach(sg => optDraw.dash(W3(sg.a), W3(sg.b), 0xff2d2d, { r: 0.026, on: 10, off: 0, opacity: op }));
      }
    }
  }
  // 法線（白色虛線）與角度標籤
  angLabs.forEach(L => { L.show = false; });
  let li = 0;
  main.hits.slice(0, 4).forEach((h, i) => {
    const a = h.p.clone().addScaledVector(h.Nf, 1.35), b = h.p.clone().addScaledVector(h.Nf, -1.35);
    optDraw.dash(W3(a, RY + 0.02), W3(b, RY + 0.02), 0xffffff, { r: 0.022, on: 0.16, off: 0.12 });
    if (h.thI < 0.6 && i > 0) return;                     // 沿半徑射出圓弧面：只畫法線，不再重複標示
    const L = angLabs[li++]; L.show = true;
    let html;
    const where = h.n1 < h.n2 ? '空氣→玻璃' : '玻璃→空氣';
    if (h.thI < 0.6) html = `${where}：垂直入射，不偏折`;
    else if (h.tir) html = `入射角 ${f1(h.thI)}° ＞ 臨界角 ${f1(Math.asin(1 / h.n1) / DEG)}° → <b>全反射</b>`;
    else html = `${where}　入射 ${f1(h.thI)}° → 折射 ${f1(h.thT)}°<br><small>${h.n1 < h.n2 ? '偏向法線' : '偏離法線'}</small>`;
    setLabel(L, html, h.tir ? 'tir' : 'ang');
    L.pos.copy(W3(h.p.clone().addScaledVector(h.Nf, 0.9), 1.25));
  });
  optDraw.end();
  // 公式列與面板
  const first = main.hits.find(h => h.thI >= 0.6) || main.hits[0];
  let cap = '<small>光學玻璃折射盤</small>';
  let note = '';
  if (OPT.kind === 'rect') {
    const h0 = main.hits[0];
    cap += `<span class="huge">空氣→玻璃：<span class="red">偏向法線</span>　玻璃→空氣：<span class="grn">偏離法線</span></span>`;
    cap += h0 ? `1.00 × sin ${f1(h0.thI)}° ＝ 1.50 × sin ${f1(h0.thT ?? 0)}°　→　出射光與入射光<b>平行</b>（只是平移）` : '';
    note = '長方體玻璃磚兩面互相平行：進去時偏向法線、出來時偏離法線，偏折量剛好抵消，所以出射光與入射光平行。';
  } else if (OPT.kind === 'semi') {
    const hf = main.hits.find(h => h.flat);
    if (hf && hf.tir) {
      cap += `<span class="huge"><span class="red">全反射！</span>入射角 ${f1(hf.thI)}° ＞ 臨界角 ${f1(CRIT)}°</span>光從玻璃（慢）射向空氣（快），角度太大就完全反射回玻璃`;
    } else if (hf) {
      cap += `<span class="huge">玻璃→空氣：<span class="grn">偏離法線</span>　${f1(hf.thI)}° → ${f1(hf.thT)}°</span>` +
        (hf.thI > CRIT - 6 ? `<b>快到臨界角 ${f1(CRIT)}° 了！</b>折射光快要貼著平面走，反射光越來越亮` : `1.50 × sin ${f1(hf.thI)}° ＝ 1.00 × sin ${f1(hf.thT)}°`);
    }
    note = `光沿半徑射入圓弧面時與法線重合（垂直入射）不偏折，所以真正的折射發生在<b>平直面</b>。玻璃的臨界角 ＝ sin⁻¹(1 ÷ 1.5) ≈ ${f1(CRIT)}°。`;
  } else {
    const tr = OPT.spread, out = tr.map(t => t.tr.segs[t.tr.segs.length - 1]);
    const ang = s2 => Math.atan2(s2.b.y - s2.a.y, s2.b.x - s2.a.x) / DEG;
    const spread = Math.abs(ang(out[6]) - ang(out[0]));
    const anyTir = tr.some(t => t.tr.hits.some(h => h.tir));
    cap += `<span class="huge">白光 → <span style="color:#e53935">紅</span><span style="color:#f57c00">橙</span><span style="color:#c9a000">黃</span><span style="color:#2e9d48">綠</span><span style="color:#1e7fd8">藍</span><span style="color:#3f45d9">靛</span><span style="color:#8e3fe0">紫</span>：色散</span>` +
      (anyTir ? '入射角太小時，光在第二面發生<b>全反射</b>出不去；把入射角調大看看' : `紫光折射率最大、偏折最多；紅光偏折最少（色帶張開約 ${f1(spread)}°）`);
    note = '不同顏色的光在玻璃中速度不同（折射率不同），偏折程度也不同，白光就被分開成彩虹色帶。單一顏色的紅色雷射不會色散，所以三稜鏡這裡改用<b>白光光源</b>。（色散程度稍微放大，方便觀察）';
  }
  setCap(cap);
  setHTML('optNote', note);
  setHTML('optStat',
    `入射角 θ₁ ＝ <b class="r">${f1(OPT.angShow)}°</b><br>` +
    (first && !first.tir && first.thT !== undefined && first.thI >= 0.6 ? `折射角 θ₂ ＝ <b class="b">${f1(first.thT)}°</b>（${first.n1 < first.n2 ? '小於' : '大於'}入射角）<br>` : '') +
    `玻璃折射率 n ＝ <b>${prism ? '1.50（紅）～ 1.56（紫）' : '1.50'}</b><br>臨界角（玻璃→空氣）＝ <b>${f1(CRIT)}°</b>`);
}

/* =========================================================
   Tab 切換、鏡頭
   ========================================================= */
const TABS = {
  vis: { group: VIS.group, cam: () => VIS.scen === 'coin' ? { pos: [0.8, 5.9, 16], target: [0.8, 3.7, 0], fitW: 13 } : { pos: [0.8, 7.4, 22], target: [0.8, 4.9, 0], fitW: 14 }, update: updateVis },
  opt: { group: OPT.group, cam: () => ({ pos: [0, 14.5, 9.6], target: [0, 0, 0.5], fitW: 13 }), update: updateOpt }
};
function setTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== t; });
  for (const [k, v] of Object.entries(TABS)) v.group.visible = k === t;
  goView(TABS[t].cam());
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* file:// */ }
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
function layoutDock() {
  const d = $('dock');
  if (window.MobileView?.isMobile()) { d.style.left = ''; d.style.maxWidth = ''; return; }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  d.style.left = ((left + window.innerWidth) / 2) + 'px';
  d.style.maxWidth = Math.max(300, window.innerWidth - left - 28) + 'px';
}
function viewFor(c) {
  const pos = V3(...c.pos), tgt = V3(...c.target);
  if (!window.innerWidth || !window.innerHeight) return { pos, tgt };
  if (window.MobileView?.isMobile()) {
    const dist = pos.distanceTo(tgt), tanH = Math.tan(Math.min(camera.fov, 50) * Math.PI / 360);
    const need = (c.fitW || 0) * 1.08 / (2 * tanH * camera.aspect);
    if (need > dist) pos.sub(tgt).multiplyScalar(need / dist).add(tgt);
    return { pos, tgt };
  }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  const dist = pos.distanceTo(tgt), tanH = Math.tan(camera.fov * Math.PI / 360);
  if (c.fitW) {
    const avail = Math.max(0.35, (window.innerWidth - left) / window.innerWidth);
    const need = c.fitW / avail / (2 * tanH * camera.aspect);
    if (need > dist * 1.0001) { pos.sub(tgt).multiplyScalar(need / dist).add(tgt); return viewFor({ pos: pos.toArray(), target: tgt.toArray() }); }
  }
  const visH = 2 * dist * tanH, visW = visH * camera.aspect;
  const sx = -(left / 2) / window.innerWidth * visW;
  const sy = (($('dock').getBoundingClientRect().height + 18) / 2) / window.innerHeight * visH;
  pos.x += sx; tgt.x += sx; pos.y += sy; tgt.y += sy;
  return { pos, tgt };
}
let camTw = null;
function goView(c, instant = false) {
  layoutDock();
  const { pos, tgt } = viewFor(c);
  if (instant) { camTw = null; camera.position.copy(pos); controls.target.copy(tgt); controls.update(); return; }
  camTw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, k: 0 };
}
controls.addEventListener('start', () => { camTw = null; });
$('viewBtn').addEventListener('click', () => goView(TABS[tab].cam()));
$('collapse').addEventListener('click', () => { const c = $('panel').classList.toggle('collapsed'); $('collapse').textContent = c ? '展開' : '收合'; layoutDock(); });
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!w || !h) return;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.fov = 40; camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { resize(); goView(TABS[tab].cam(), true); });

const clock = new THREE.Clock();
function frame(dt) {
  wall += dt;
  TABS[tab].update(dt);
  if (camTw) {
    camTw.k = Math.min(1, camTw.k + dt / 1.3);
    const s = smooth(0, 1, camTw.k);
    camera.position.lerpVectors(camTw.p0, camTw.p1, s);
    controls.target.lerpVectors(camTw.t0, camTw.t1, s);
    if (camTw.k >= 1) camTw = null;
  }
  controls.update();
  if (!window.innerWidth || !window.innerHeight) return;
  placeLabels();
  window.MobileView?.offset(camera);
  renderer.render(scene, camera);
}
function animate() { frame(Math.min(clock.getDelta(), 0.05)); requestAnimationFrame(animate); }

window.lab = { frame, setTab, setScen, setKind, VIS, OPT, SH, trace, visGeometry, solveRay, camera, controls };

resize();
const first = TABS[location.hash.slice(1)] ? location.hash.slice(1) : 'vis';
tab = first;
for (const [k, v] of Object.entries(TABS)) v.group.visible = k === first;
document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === first));
document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== first; });
goView(TABS[first].cam(), true);
animate();
</script>

<script>
setTimeout(() => {
  if (!window.__labReady) {
    document.getElementById('scene').innerHTML = '<div class="fallback">無法載入 Three.js。<br>請確認電腦已連上網路後重新整理。</div>';
  }
}, 6000);
</script>
</body>
