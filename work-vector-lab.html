function plankTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;

  const n = 8;
  for (let i = 0; i < n; i++) {

function Arrow(hex) {

function Dashed(color, max = 36) {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color, toneMapped: false, transparent: true, opacity: 0.92 });
  const geo = new THREE.CylinderGeometry(1, 1, 1, 6);
  const segs = [];

    const m = new THREE.Mesh(geo, mat);

const GLOW = glowTex();
function bits(parent, color, n, mode) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    const m = new THREE.SpriteMaterial({
      map: GLOW, color, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, opacity: 0.8
    });
    const s = new THREE.Sprite(m);
    s.userData.life = Math.random();
    s.userData.seed = Math.random() * Math.PI * 2;
    s.visible = false;
    parent.add(s);
    arr.push(s);
  }
  return {
    show(v) { for (const s of arr) s.visible = v; },
    update(dt) {
      for (const s of arr) {
        if (!s.visible) continue;
        s.userData.life += dt * (mode === 'in' ? 0.48 : 0.36);
        if (s.userData.life > 1) s.userData.life -= 1;
        const u = s.userData.life, seed = s.userData.seed;
        if (mode === 'in') {
          const rad = 0.1 + (1 - u) * 0.95;
          s.position.set(Math.cos(seed) * rad * 0.9, 0.58 + Math.sin(seed * 2.2) * 0.16 * (1 - u * 0.4), Math.sin(seed) * rad * 0.62);
          s.material.opacity = Math.sin(Math.min(1, u) * Math.PI) * 0.72;
          s.scale.setScalar(0.12 + (1 - u) * 0.14);
        } else {
          s.position.set(0.7 + Math.sin(seed) * 0.12, 0.28 + u * 1.55, Math.cos(seed) * (0.08 + u * 0.55));
          s.material.opacity = (1 - u) * 0.75;
          s.scale.setScalar(0.12 + u * 0.2);
        }
      }
    }
  };
}

  group.add(sA, mark);
  const lF = addLabel('zero', 'vF'), lS = addLabel('zero', 'vS');
  const SSCALE = 0.66, HOME = -1.2, SMAX = 5, FLOAT_Y = 1.22;
  const st = { shown: 0, sNow: 0 };
  const now = V3(), start = V3(), vec = V3();
  brief.position.set(HOME, FLOAT_Y, 0);
  brief.updateMatrixWorld(true);
  const handleLocal = V3(0, 0.56, 0);
  brief.localToWorld(start.copy(handleLocal));
  const startFixed = start.clone();
  function read() {
    return {
      progress: st.shown, sNow: st.sNow, work: 0, fPar: 0,
      red: lift.visible, blue: sA.visible, right: mark.visible, liftX: brief.position.x
    };
  }
  function update(dt) {
    const target = (+$('zeGo').value) / 100;
    st.shown = Math.abs(st.shown - target) < 0.0015 ? target : lerp(st.shown, target, 1 - Math.exp(-dt * 8));
    st.sNow = st.shown * SMAX;
    brief.position.x = HOME + st.sNow * SSCALE;
    trail.stamp(brief.position);
    trail.update(dt);
    st.busy = Math.abs(st.shown - target) > 0.006 || trail.alive();
    brief.updateMatrixWorld(true);
    now.copy(handleLocal);
    brief.localToWorld(now);
    blob.position.x = brief.position.x;
    vec.set(now.x - startFixed.x, 0, 0);
    sA.set(startFixed, vec);
    mark.position.set(now.x, now.y, now.z);
    mark.visible = vec.length() > 0.1;
    lF.pos.set(now.x, now.y + 0.85, now.z);
    lF.show = true;
    setLabel(lF, '施力 50 牛頓　向上');
    lS.pos.set((startFixed.x + now.x) / 2, now.y + 0.28, 0);
    lS.show = sA.visible;
    setLabel(lS, `位移 ${num(st.sNow)} 公尺　向前`);
    $('zeGoV').textContent = `${Math.round(st.shown * 100)}%`;
    setHTML('zeStat', `<div class="name">提力向上，位移向前</div>
      <div class="nums"><span class="r">平行的力 ${num(0)} 牛頓</span> × <span class="b">${num(st.sNow)} 公尺</span> ＝ <b>${numProd(product(0, st.sNow))} 焦耳</b></div>
      <div class="sub">提力 50 牛頓只是把公事包托住（平衡重力），沒有上下的位移。</div>`);
    $('zeCard').textContent = st.sNow > 0.08
      ? '施力（向上）與位移（向前）互相垂直！平行的力為 0 → 完全不作功（0 焦耳）！（手酸但物理上沒作功）'
      : '公事包被向上的提力托住。把【水平移動進度】往右拉，看水平走路時手到底有沒有作功。';
    setCap(st.sNow > 0.08
      ? `<small>零功陷阱</small>向上的力、向前的位移，互相垂直<span class="huge">平行的力是 0 → <span class="grn">0 焦耳</span></span>`
      : `<small>零功陷阱</small>提著公事包，還沒有水平移動<span class="huge org">往右拉，看會不會作功</span>`);
  }
  group.visible = false;
  return { group, update, read, trail, busy: () => st.busy, cam: () => ({ pos: [0.35, 2.15, 5.7], target: [0.05, 1.35, 0], fitW: 6.8 }) };
})();

const TABS = { sandbox: SB, sign: SG, zero: ZE };

function layoutDock() {
  const d = $('dock');
  if (window.MobileView?.isMobile()) { d.style.left = ''; d.style.maxWidth = ''; return; }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  d.style.left = ((left + window.innerWidth) / 2) + 'px';
  d.style.maxWidth = Math.max(280, window.innerWidth - left - 28) + 'px';
}
function viewFor(c) {
  const pos = V3(...c.pos), tgt = V3(...c.target);
  if (!window.innerWidth || !window.innerHeight) return { pos, tgt };
  if (window.MobileView?.isMobile()) {
    const dist = pos.distanceTo(tgt);
    const tanH = Math.tan(Math.min(camera.fov, 50) * Math.PI / 360);
    const need = (c.fitW || 0) * (camera.aspect < 0.85 ? 0.62 : 1.08) / (2 * tanH * Math.max(0.28, camera.aspect));
    if (need > dist) pos.sub(tgt).multiplyScalar(need / dist).add(tgt);
    return { pos, tgt };
  }
  const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
  const dist = pos.distanceTo(tgt), tanH = Math.tan(camera.fov * Math.PI / 360);
  if (c.fitW) {
    const avail = Math.max(0.35, (window.innerWidth - left) / window.innerWidth);
    const need = c.fitW / avail / (2 * tanH * camera.aspect);
    if (need > dist * 1.0001) {
      pos.sub(tgt).multiplyScalar(need / dist).add(tgt);
      return viewFor({ pos: pos.toArray(), target: tgt.toArray(), fitW: c.fitW });
    }
  }
  const visH = 2 * dist * tanH, visW = visH * camera.aspect;
  const sx = -(left / 2) / window.innerWidth * visW;
  const sy = (($('dock').getBoundingClientRect().height + 18) / 2) / window.innerHeight * visH;
  pos.x += sx; tgt.x += sx; pos.y += sy; tgt.y += sy;
  return { pos, tgt };
}
let camTw = null;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function goView(c, instant = false) {
  layoutDock();
  const { pos, tgt } = viewFor(c);
  if (instant || reduceMotion) {
    camTw = null;
    camera.position.copy(pos);
    controls.target.copy(tgt);
    controls.update();
    return;
  }
  camTw = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, k: 0 };
}
controls.addEventListener('start', () => { camTw = null; });
function setTab(t, instant = false) {
  if (!TABS[t]) t = 'sandbox';
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.sec').forEach(s => { s.hidden = s.dataset.tab !== t; });
  for (const [k, v] of Object.entries(TABS)) v.group.visible = k === t;
  $('lgP').hidden = t !== 'sandbox';
  $('lgF').textContent = t === 'sign' ? '施力／摩擦' : '施力';
  if (location.hash.slice(1) !== t) {
    try { history.replaceState(null, '', '#' + t); } catch (e) { /* 本機檔案 */ }
  }
  goView(TABS[t].cam(), instant);
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { if (b.dataset.tab !== tab) setTab(b.dataset.tab); }));
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (TABS[h] && h !== tab) setTab(h);
});
$('viewBtn').addEventListener('click', () => goView(TABS[tab].cam()));
$('collapse').addEventListener('click', () => {
  const c = $('panel').classList.toggle('collapsed');
  $('collapse').textContent = c ? '展開' : '收合';
  layoutDock();
  goView(TABS[tab].cam(), true);
});
['pointerdown', 'wheel', 'touchstart', 'mousedown'].forEach(ev => {
  $('dock').addEventListener(ev, e => e.stopPropagation(), { passive: true });
});
function syncQuality() {
  const rec = window.Look ? window.Look.mode === 'record' : look.tier() === 'record';
  $('qClass').classList.toggle('on', !rec);
  $('qRecord').classList.toggle('on', rec);
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!w || !h) return;
  look.apply();
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = 40;
  camera.updateProjectionMatrix();
  syncQuality();
}
$('qClass').addEventListener('click', () => { look.setTier('class'); if (window.Look) window.Look.setMode('class'); else resize(); });
$('qRecord').addEventListener('click', () => { look.setTier('record'); if (window.Look) window.Look.setMode('record'); else resize(); });
window.addEventListener('resize', () => { resize(); if (TABS[tab]) goView(TABS[tab].cam(), true); });

const body = document.querySelector('#panel .body');
mountPresets(body, [
  { label: '水平全力作功', title: '拉繩水平，施力全部跟位移平行', tab: 'sandbox', values: { sbDir: 0, sbF: 40, sbS: 6, sbGo: 100 } },
  { label: '會考：零功陷阱', title: '拉繩垂直，跟位移平行的力是 0', tab: 'sandbox', values: { sbDir: 100, sbF: 30, sbS: 4, sbGo: 100 } },
  { label: '正功：推車', title: '施力與位移同向', tab: 'sign', values: { sgGo: 85 }, clicks: ['#sgPos'] },
  { label: '負功：煞車', title: '摩擦力與位移反向', tab: 'sign', values: { sgGo: 85 }, clicks: ['#sgNeg'] },
  { label: '提著走不作功', title: '提力向上、人水平往前', tab: 'zero', values: { zeGo: 100 } }
]);
const toolRow = document.createElement('div');
toolRow.className = 'lab-tools';
body.querySelector('.lab-presets').after(toolRow);
mountTrailToggle(toolRow, [SB.trail, SG.trail, ZE.trail]);
const synth = mountSoundToggle(toolRow);

const clock = new THREE.Clock();
function frame(dt) {
  TABS[tab].update(dt);
  if (camTw) {
    camTw.k = Math.min(1, camTw.k + dt / 1.45);
    const s = smooth(0, 1, camTw.k);
    camera.position.lerpVectors(camTw.p0, camTw.p1, s);
    controls.target.lerpVectors(camTw.t0, camTw.t1, s);
    if (camTw.k >= 1) camTw = null;
  }
  const moved = controls.update();
  if (!window.innerWidth || !window.innerHeight) return true;
  window.MobileView?.offset(camera);
  placeLabels();
  const read = TABS[tab].read();
  const amount = tab === 'sandbox' ? Math.min(1, (read.fPar || 0) / 40)
    : tab === 'sign' ? (read.sNow > 0.08 ? 0.7 : 0) : 0;
  synth.level(amount);
  renderer.render(scene, camera);
  return !!(camTw || moved || TABS[tab].busy?.());
}
const loop = runAdaptive(dt => frame(Math.min(dt, 0.05)), { autostart: false });

window.lab = {
  frame, setTab, camera, controls, renderer, scene,
  read: () => ({ tab, sandbox: SB.read(), sign: SG.read(), zero: ZE.read() })
};

resize();
const first = TABS[location.hash.slice(1)] ? location.hash.slice(1) : 'sandbox';
setTab(first, true);
loop.wake();
</script>

<script>
setTimeout(() => {
  if (!window.__labReady) {
    document.getElementById('scene').innerHTML = '<div class="fallback">無法載入 Three.js。<br>請確認電腦已連上網路後重新整理。</div>';
  }
}, 6000);
</script>
<script src="goals.js" defer></script>
</body>
